<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Deemer-Berdux Family Cookbook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #FAF9F5;
    --card: #FFFFFF;
    --ink: #16130F;
    --ink-soft: #726C60;
    --ink-faint: #A39C8C;
    --line: #E7E2D5;
    --stamp: #2C4159;
    --stamp-soft: #E4E9EE;
    --alert: #8B3A2F;
    --alert-soft: #F3E4E0;
    --shadow: 0 1px 3px rgba(22,19,15,0.06);
    --maxw: 1440px;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  ::selection{background:var(--stamp); color:#fff;}

  .masthead{ border-bottom:1px solid var(--line); }
  .masthead-inner{ max-width:var(--maxw); margin:0 auto; padding:36px 32px; text-align:center; }
  h1.title{
    font-family:'Inter',sans-serif; font-weight:700;
    font-size:clamp(28px, 3.6vw, 42px); line-height:1.1;
    letter-spacing:-0.01em; margin:0; color:var(--ink);
  }

  .controls{ max-width:var(--maxw); margin:0 auto; padding:22px 32px 20px; }
  .search-row{
    display:flex; align-items:center; gap:16px;
    border-bottom:1.5px solid var(--ink); padding-bottom:12px;
  }
  .search-row svg{opacity:0.45; flex:0 0 auto;}
  .search-row input{
    border:none; outline:none; background:transparent;
    font-family:'Inter',sans-serif; font-weight:500;
    font-size:19px; color:var(--ink); width:100%;
  }
  .search-row input::placeholder{color:var(--ink-faint); font-weight:400;}
  .result-count{
    font-family:'IBM Plex Mono', monospace; font-size:11px;
    color:var(--ink-soft); white-space:nowrap;
  }

  .facet-rows{ margin-top:18px; display:flex; flex-direction:column; gap:10px; }
  .facet-row{ display:flex; align-items:baseline; flex-wrap:wrap; gap:4px 4px; }
  .facet-name{
    font-family:'IBM Plex Mono', monospace; font-size:10.5px;
    text-transform:uppercase; letter-spacing:0.12em; color:var(--ink-faint);
    width:80px; flex:0 0 auto;
  }
  .facet-link{
    font-family:'Inter',sans-serif; font-size:13.5px; color:var(--ink-soft);
    padding:4px 10px; cursor:pointer; border-bottom:1px solid transparent;
    white-space:nowrap; transition:color .12s ease, border-color .12s ease;
  }
  .facet-link:hover{color:var(--ink);}
  .facet-link.active{ color:var(--stamp); border-bottom:1px solid var(--stamp); font-weight:600; }
  .facet-link .n{color:var(--ink-faint); font-size:11px;}
  .facet-link.active .n{color:var(--stamp); opacity:0.6;}

  .clear-link{
    font-family:'IBM Plex Mono', monospace; font-size:10.5px;
    text-transform:uppercase; letter-spacing:0.08em; color:var(--ink-faint);
    cursor:pointer; text-decoration:underline; text-underline-offset:3px; margin-left:4px;
  }
  .clear-link:hover{color:var(--alert);}

  .grid{
    max-width:var(--maxw); margin:0 auto; padding:8px 24px 100px;
    display:grid; grid-template-columns:repeat(auto-fill, minmax(240px, 1fr));
    gap:1px; background:var(--line); border:1px solid var(--line);
  }
  .empty-state{
    grid-column:1/-1; text-align:center; padding:90px 20px; color:var(--ink-soft);
    font-family:'Inter',sans-serif; font-style:italic; font-size:18px; background:var(--paper);
  }

  .card{
    background:var(--card); padding:18px 18px 16px; cursor:pointer;
    display:flex; flex-direction:column; min-height:196px; position:relative;
    transition:background .12s ease;
  }
  .card:hover{background:#FDFCFA;}
  .card:hover .card-title{color:var(--stamp);}
  .card-top{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:12px; gap:8px; }
  .card-tags{ display:flex; flex-wrap:wrap; gap:5px; }
  .stamp-badge{
    font-family:'IBM Plex Mono', monospace; font-size:9px; text-transform:uppercase;
    letter-spacing:0.07em; color:var(--stamp); border:1px solid var(--stamp);
    padding:3px 7px; border-radius:2px; white-space:nowrap;
  }
  .stamp-badge.cuisine{
    color:var(--ink-soft); border-color:var(--line); background:var(--stamp-soft);
  }
  .card-time{
    font-family:'IBM Plex Mono', monospace; font-size:9.5px;
    color:var(--ink-faint); white-space:nowrap; text-align:right; line-height:1.4; flex:0 0 auto;
  }
  .card-title{
    font-family:'Inter',sans-serif; font-weight:600; font-size:18px;
    line-height:1.22; margin:0 0 auto; flex:1; transition:color .12s ease;
  }
  .card-bottom{
    margin-top:14px; padding-top:12px; border-top:1px solid var(--line);
    display:flex; justify-content:space-between; align-items:baseline; gap:10px;
  }
  .card-source{
    font-family:'Inter',sans-serif; font-style:italic; font-size:12px; color:var(--ink-soft);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .card-servings{ font-family:'IBM Plex Mono', monospace; font-size:10px; color:var(--ink-faint); white-space:nowrap; }

  .modal-overlay{
    position:fixed; inset:0; background:rgba(22,19,15,0.45); display:none;
    align-items:flex-start; justify-content:center; z-index:100; padding:40px 16px; overflow-y:auto;
  }
  .modal-overlay.open{display:flex;}
  .modal{
    background:var(--card); max-width:880px; width:100%;
    box-shadow:0 40px 80px rgba(0,0,0,0.25); position:relative;
    animation:modalIn .2s cubic-bezier(.2,.8,.3,1); margin-bottom:40px; border-top:3px solid var(--stamp);
  }
  @keyframes modalIn{ from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }
  .modal-inner{padding:32px 40px 40px;}
  .modal-close{
    position:absolute; top:18px; right:18px; width:30px; height:30px;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    font-size:19px; color:var(--ink-soft); line-height:1; font-family:'IBM Plex Mono', monospace;
  }
  .modal-close:hover{color:var(--ink);}
  .modal-top{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:14px; }
  .modal-eyebrow{
    font-family:'IBM Plex Mono', monospace; font-size:10.5px; text-transform:uppercase;
    letter-spacing:0.09em; color:var(--ink-soft); display:flex; gap:14px; flex-wrap:wrap;
  }
  .modal h2{
    font-family:'Inter',sans-serif; font-weight:700; font-size:28px;
    line-height:1.14; margin:0 0 6px; padding-right:20px;
  }
  .modal .source-line{
    font-family:'Inter',sans-serif; font-style:italic; color:var(--ink-soft); font-size:13.5px;
    margin-bottom:16px; padding-bottom:16px; border-bottom:1px solid var(--line);
  }
  .tags{display:flex; gap:6px; flex-wrap:wrap; margin:8px 0 0;}
  .tagpill{
    font-family:'IBM Plex Mono', monospace; font-size:9.5px; text-transform:uppercase;
    letter-spacing:0.05em; border:1px solid var(--line); padding:2px 9px; color:var(--ink-soft);
  }
  .section-title{
    font-family:'IBM Plex Mono', monospace; font-size:10.5px; text-transform:uppercase;
    letter-spacing:0.11em; color:var(--stamp); margin:22px 0 10px;
  }
  .ing-list{list-style:none; margin:0; padding:0; columns:2; column-gap:32px;}
  .ing-list li{
    padding:5px 0 5px 20px; position:relative; font-size:13.5px;
    line-height:1.35; border-bottom:1px solid #F1EDE2; break-inside:avoid;
  }
  .ing-list li.heading{
    font-weight:700; font-family:'IBM Plex Mono', monospace; font-size:10px;
    text-transform:uppercase; letter-spacing:0.06em; color:var(--ink-soft);
    padding-left:0; border-bottom:none; margin-top:10px; column-span:all;
  }
  .ing-list li.heading:first-child{margin-top:0;}
  .ing-list li:not(.heading)::before{
    content:""; position:absolute; left:1px; top:13px; width:5px; height:5px;
    background:var(--stamp); border-radius:50%; opacity:0.55;
  }
  .steps{list-style:none; counter-reset:step; margin:0; padding:0;}
  .steps li{ counter-increment:step; padding:0 0 13px 34px; position:relative; font-size:14px; line-height:1.42; }
  .steps li::before{
    content:counter(step); position:absolute; left:0; top:0;
    font-family:'Inter',sans-serif; font-weight:700; font-size:14px; color:var(--stamp);
  }
  .steps li strong{ font-weight:700; color:var(--ink); }
  .notes-box{
    margin-top:20px; background:var(--stamp-soft); padding:13px 18px;
    border-radius:2px; font-size:13px; line-height:1.42; color:#1c2c3d;
  }
  .notes-box .notes-label{
    font-family:'IBM Plex Mono', monospace; font-size:9.5px; text-transform:uppercase;
    letter-spacing:0.08em; color:var(--stamp); margin-bottom:6px; display:block;
  }

  footer{
    text-align:center; padding:30px 20px 60px; font-family:'IBM Plex Mono', monospace;
    font-size:11px; color:var(--ink-faint); letter-spacing:0.03em;
  }

  @media (max-width:640px){
    .masthead-inner{padding:24px 20px;}
    .controls{padding:18px 20px 20px;}
    .grid{padding:8px 14px 90px; grid-template-columns:repeat(auto-fill, minmax(160px, 1fr));}
    .modal-inner{padding:24px 20px 28px;}
    .modal h2{font-size:23px;}
    .ing-list{columns:1;}
    .facet-name{width:100%; margin-bottom:2px;}
  }
</style>
</head>
<body>

<div class="masthead">
  <div class="masthead-inner">
    <h1 class="title">The Deemer-Berdux Family Cookbook</h1>
  </div>
</div>

<div class="controls">
  <div class="search-row">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
    <input id="searchInput" type="text" placeholder="Search for recipes">
    <span class="result-count" id="resultCount"></span>
  </div>

  <div class="facet-rows">
    <div class="facet-row">
      <span class="facet-name">Course</span>
      <div id="categoryChips" style="display:flex; flex-wrap:wrap;"></div>
    </div>
    <div class="facet-row">
      <span class="facet-name">Cuisine</span>
      <div id="cuisineChips" style="display:flex; flex-wrap:wrap;"></div>
      <span class="clear-link" id="clearFilters">clear filters</span>
    </div>
  </div>
</div>

<main class="grid" id="grid"></main>

<footer id="footerCount"></footer>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modalCard">
    <div class="modal-inner">
      <div class="modal-close" id="modalClose">&times;</div>
      <div class="modal-top">
        <div class="modal-eyebrow" id="modalEyebrow"></div>
      </div>
      <h2 id="modalTitle"></h2>
      <div class="source-line" id="modalSource"></div>
      <div class="tags" id="modalTags"></div>

      <div class="section-title">Ingredients</div>
      <ul class="ing-list" id="modalIngredients"></ul>

      <div class="section-title">Method</div>
      <ol class="steps" id="modalSteps"></ol>

      <div id="modalNotesWrap"></div>
    </div>
  </div>
</div>

<script>
const RECIPES = [
  {
    "id": "beef-stroganoff",
    "title": "Easy Beef Stroganoff",
    "category": "Main",
    "cuisine": "American",
    "source": "Hunt's recipe card (1994) + family tweaks",

    "ingredients": [
      "2 lbs (910 g) boneless chuck steak, cut into 1/4-inch strips",

      "1 cup (240 ml) chopped onion",
      "1 cup (240 ml) sliced mushrooms",
      "1 (6 oz/168 g) can Hunt's Tomato Paste, No Salt Added",
      "1 1/4 cup (300 ml) water",
      "2 Tbsp (30 ml) Worcestershire sauce",
      "1 tsp (5 ml) garlic powder",
      "1/2 cup (120 ml) sour cream",
      "Flour and paprika (family addition)"
    ],
    "instructions": [
      "In a large skillet, brown meat in hot oil. Remove meat.",
      "Sauté onion and mushrooms in skillet drippings until golden brown.",
      "Stir in remaining ingredients except sour cream.",
      "Return meat to skillet. Cover, simmer 30 minutes or until meat is tender, stirring occasionally.",
      "Remove from heat. Gradually stir in sour cream; blend well.",
      "Serve over rice or noodles."
    ],
    "notes": "Family variation (handwritten on the card): use 1 small onion and a big spoonful of garlic instead of the printed amounts. Add flour & paprika to the meat before browning. Add Worcestershire and cover the pan. Once the steak is back in, add 2 cans of cream, then simmer/boil for about 1.5 hours - stir in the sour cream about 15 minutes before serving, not at the very end.",
    "needsReview": false,
    "cookTime": "30 minutes",
    "prepTime": "24 minutes"
  },
  {
    "id": "crab-dip",
    "title": "Reduced Fat Creamy Crab Dip",
    "category": "Appetizer",
    "cuisine": "American",
    "source": "Kraft Foods (submitted by YetterEA)",
    "servings": "8",
    "ingredients": [
      "4 oz (112 g) reduced fat cream cheese",
      "1/2 cup (120 ml) 2% milk shredded cheese",
      "2 packages (3.53 oz each/99 g) Chicken of the Sea Premium Crab",
      "2 Tbsp (30 ml) light mayo",
      "2 Tbsp (30 ml) light sour cream",
      "3 tsp (15 ml) Tabasco (optional)",
      "2 tsp (10 ml) Old Bay (optional)"
    ],
    "instructions": [
      "Let cream cheese soften to room temperature.",
      "Add all ingredients to a medium sized oven-safe bowl. Mix until well blended with a spoon.",
      "Put in the oven for 15-20 minutes at 325°F (165°C) until dip is bubbly.",
      "Serve with Wheat Thins, Triscuit, bread pieces, or tortillas."
    ],
    "notes": "Use whatever cheese you prefer - a colby/monterey jack blend works well. Crab is found in the tuna aisle. Tabasco doesn't make it spicy, just adds a little flavor - safe even if you don't like spicy food.",
    "needsReview": false,
    "cookTime": "20 minutes",
    "prepTime": "16 minutes"
  },
  {
    "id": "chapatis",
    "title": "Chapatis",
    "category": "Bread",
    "cuisine": "Indian",

    "servings": "16 (enough for 4 people)",
    "tags": [
      "Dairy Free",
      "Vegetarian"
    ],
    "ingredients": [
      "3 1/4 cups (780 ml) chapati flour, or 1 1/4 cups (300 ml) whole wheat + 1 1/4 cups (300 ml) all-purpose white flour",
      "1/2 tsp (2 ml) salt",
      "1 tsp (5 ml) canola oil (plus extra to dust)",
      "1 cup (240 ml) plus 2 Tbsp (30 ml) hot water"
    ],
    "instructions": [
      "**Put flour into a bowl, add the salt, and mix together.** Make a well in the middle, add the oil, and mix using your fingers.",
      "Pour in 1 cup of the water, then add the rest little by little - you may not need it all - until you can knead the mixture into a soft and pliable dough, which will take 6 to 8 minutes.",
      "Lightly rub the dough with oil so it won't dry out and put it to one side while you get your rolling station ready: a floured board or clean surface, a rolling pin, a bowl of flour to dip the balls of dough in, a spatula (or chapati press), a frying pan, and a plate for your cooked chapatis.",
      "Once all is ready, divide your dough into 16 balls.",
      "**Put the frying pan on medium to high heat.** Take one piece of dough, coat it generously with flour, then roll it out to around 6 inches in diameter, using a spatula as you need it to stop it from sticking. Put it face down on the hot pan.",
      "**Wait for the edges to color white and start to bubble (30 to 40 seconds), then turn it over and cook the other side the same amount of time.** Turn again - it should start to puff up at this point - press down with the flat side of the spatula, and cook for around 10 seconds, then turn again. Check that all the uncooked spots look dark and doughy and do the same, and put onto a plate.",

  {
    "id": "kanom-jeen",

      "Seasonings: fish sauce, soy sauce, kosher salt, red chili flakes",
      "4 lime wedges, for squeezing"

    "instructions": [
      "**Make the coconut fish curry: in a medium saucepan, combine the fish with enough water to fully submerge it.** Bring to a boil over high heat, reduce to a simmer, and cook for a couple of minutes, just until you can easily flake the fish with a fork. Use a slotted spoon to transfer the fish to a blender, reserving the cooking liquid in the pan.",
      "**Add 1 cup of the coconut milk and 1 cup of the fish cooking liquid to the blender with the fish.** Process until smooth.",
      "**In a medium saucepan, bring 2 cups of the coconut milk to a boil over high heat.** Add the pureed fish mixture, curry paste, shrimp paste, lemongrass, ground dried shrimp, salt, and brown sugar. Bring to a boil, using a wooden spoon to break up the shrimp paste, then reduce heat to medium-low and simmer for 5 minutes, stirring occasionally.",

  {

      "**Press the dough evenly into an ungreased 18 x 12 x 1-inch baking sheet, making an edge around the outside.** It will be very sticky; sprinkle the dough and your hands lightly with flour.",
      "Bake for 15 minutes, until the crust is set but not browned. Allow to cool.",
      "**For the topping, combine the butter, honey, brown sugar, and zests in a large, heavy-bottomed saucepan.** Cook over low heat until the butter is melted, using a wooden spoon to stir. Raise the heat and boil for 3 minutes.",

    "needsReview": false,
    "cookTime": "48 minutes",
    "prepTime": "30 minutes"

  {
    "id": "watermelon-cosmo",

    "ingredients": [

      "Stir in the vodka, Cointreau, and lime juice.",
      "Fill a cocktail shaker half full with ice, pour in the cocktail mixture, and shake for a full 30 seconds.",
      "Pour into the chilled martini glasses and garnish each glass with a sprig of mint. Serve ice cold."
    ],
    "notes": "If you make this with seedless watermelon (or carefully deseeded regular watermelon), you can puree the watermelon in a blender and pour it through a fine-mesh sieve to remove the pulp instead of using a food mill. Make Ahead friendly.",
    "needsReview": false,
    "cookTime": "8 minutes",
    "prepTime": "1 hour"
  },
  {
    "id": "chipotle-cheddar-crackers",
    "title": "Chipotle Cheddar Crackers",
    "category": "Appetizer",
    "cuisine": "American",
    "source": "\"Go-To Dinners\" cookbook, p. 42",

    "ingredients": [

    "cuisine": "American",
    "source": "Molly Baz, \"Cook This Book: Techniques That Teach and Recipes to Repeat\", p. 233",
    "servings": "4 to 6",
    "ingredients": [
      "2 large leeks",
      "2 whole garlic heads, plus 5 garlic cloves",
      "6 celery stalks",
      "2 medium turnips or parsnips (about 1 3/4 lbs (795 g))",
      "3 large thyme sprigs",
      "4 chicken legs (drumstick plus thigh attached) or 4 thighs and 4 drumsticks (about 2 lbs (910 g))",
      "2 lbs (910 g) chicken wings",
      "Kosher salt",
      "1 Tbsp (15 ml) whole black peppercorns, plus more for grinding",
      "8 prunes",
      "2 Tbsp (30 ml) extra-virgin olive oil"
    ],
    "instructions": [
      "**Start the broth: season the chicken legs and wings all over with 4 teaspoons salt.** Place all the chicken in the pot. Cut the leeks in half lengthwise, separating the dark green parts from the white (set the white parts aside for later). Rinse the leek greens well. Cut the garlic heads in half crosswise. Cut 4 celery stalks crosswise into 2-inch pieces. Chop 1 turnip (no need to peel) into 2-inch wedges. Add all the chopped veg to the pot along with the peppercorns, 2 prunes, 1 thyme sprig, and 1 tablespoon salt. Add 12 cups water and bring to a simmer over medium-high heat. Reduce heat to maintain a simmer and cook, uncovered, for 1 hour, occasionally skimming foam from the surface.",
      "**Prep the rest of the veg: thinly slice the remaining 2 celery stalks crosswise.** Thinly slice the garlic cloves. Cut the leeks crosswise on a bias into 1 1/2-inch pieces. Cut the remaining turnip into quarters through the root end and slice crosswise into 1/4-inch-thick pieces. Tear the remaining 6 prunes into 2 or 3 pieces. Pick the leaves from the remaining thyme sprigs.",
      "**Shred the chicken: once the soup has simmered for 1 hour, pluck out the chicken legs and transfer to a plate to cool.** Continue simmering the stock. Shred the meat off the bones into bite-size pieces, discard the skin, and add the bones back into the broth.",
      "**Assemble the soup: with the broth still simmering, heat the olive oil in a large Dutch oven over medium heat.** Add the leeks, garlic, and prunes and season with salt and lots of black pepper. Cook, stirring frequently, until the leeks begin to soften and collapse, 3 to 4 minutes. Scoop out about 1/4 cup broth and add it to the leeks. Continue cooking until the leeks are softened but not browned, 10 to 12 minutes. Strain the hot broth right into the Dutch oven, discarding the chicken wings, bones, skin, and vegetables. Add the shredded chicken and the sliced turnips, thyme leaves, and sliced celery and simmer over medium-high heat until the turnips and celery are just cooked through and tender, 4 to 5 minutes. Season generously with salt.",
      "Serve: divide the soup among bowls. Garnish each bowl with black pepper and the reserved celery leaves."
    ],
    "notes": "Turnips and prunes lend earthiness and sweetness in place of carrots - the author simply doesn't have any love in her heart for boiled carrots.",
    "needsReview": false,
    "cookTime": "3 hours 21 minutes",
    "prepTime": "25 minutes"
  }
];

</script>
<script>
let state = { query: "", category: null, cuisine: null };

const COURSE_ORDER = ["Appetizer", "Salad", "Soup", "Bread", "Side", "Main", "Dessert", "Breakfast", "Drink"];

function uniqueSorted(arr){ return [...new Set(arr)].sort((a,b)=>a.localeCompare(b)); }
function orderByList(values, order){
  const set = new Set(values);
  const known = order.filter(v => set.has(v));
  const unknown = [...set].filter(v => !order.includes(v)).sort((a,b)=>a.localeCompare(b));
  return [...known, ...unknown];
}

const ALL_CATEGORIES = orderByList(RECIPES.map(r=>r.category), COURSE_ORDER);
const ALL_CUISINES = uniqueSorted(RECIPES.map(r=>r.cuisine));
function countFor(field, value){ return RECIPES.filter(r=>r[field]===value).length; }

function renderChips(){
  const catWrap = document.getElementById('categoryChips');
  catWrap.innerHTML = '';
  ALL_CATEGORIES.forEach(cat=>{
    const chip = document.createElement('span');
    chip.className = 'facet-link' + (state.category===cat ? ' active':'');
    chip.innerHTML = `${cat} <span class="n">${countFor('category',cat)}</span>`;
    chip.onclick = ()=>{ state.category = state.category===cat ? null : cat; render(); };
    catWrap.appendChild(chip);
  });

  const cuiWrap = document.getElementById('cuisineChips');
  cuiWrap.innerHTML = '';
  ALL_CUISINES.forEach(cui=>{
    const chip = document.createElement('span');
    chip.className = 'facet-link' + (state.cuisine===cui ? ' active':'');
    chip.innerHTML = `${cui} <span class="n">${countFor('cuisine',cui)}</span>`;
    chip.onclick = ()=>{ state.cuisine = state.cuisine===cui ? null : cui; render(); };
    cuiWrap.appendChild(chip);
  });
}

function matchesQuery(recipe, q){
  if(!q) return true;
  q = q.toLowerCase();
  const haystack = [
    recipe.title, recipe.category, recipe.cuisine, recipe.source,
    (recipe.ingredients||[]).join(' '), (recipe.instructions||[]).join(' '),
    recipe.notes||'', (recipe.tags||[]).join(' ')
  ].join(' ').toLowerCase();
  return q.split(/\s+/).filter(Boolean).every(term => haystack.includes(term));
}

function getFiltered(){
  const filtered = RECIPES.filter(r=>{
    if(state.category && r.category!==state.category) return false;
    if(state.cuisine && r.cuisine!==state.cuisine) return false;
    if(!matchesQuery(r, state.query)) return false;
    return true;
  });
  // auto-sort alphabetically by cuisine, then by title within each cuisine
  filtered.sort((a,b)=> a.cuisine.localeCompare(b.cuisine) || a.title.localeCompare(b.title));
  return filtered;
}

function timeLabel(mins_str){
  return mins_str || null;
}

function servingsLabel(s){
  const str = String(s);
  return /^(makes|serves)\b/i.test(str) ? str : `Serves ${str}`;
}

function cardTimeHTML(r){
  const parts = [];
  if(r.prepTime) parts.push(`Prep ${r.prepTime}`);
  if(r.cookTime) parts.push(`Cook ${r.cookTime}`);
  if(!parts.length) return '';
  return parts.join('<br>');
}

function renderGrid(){
  const grid = document.getElementById('grid');
  const filtered = getFiltered();
  grid.innerHTML = '';

  document.getElementById('resultCount').textContent = `${filtered.length} / ${RECIPES.length}`;
  document.getElementById('footerCount').textContent = `${RECIPES.length} recipes catalogued, and counting.`;

  if(filtered.length===0){
    grid.innerHTML = `<div class="empty-state">Nothing on file matches that yet &mdash; try another search or clear a filter.</div>`;
    return;
  }

  filtered.forEach((r)=>{
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="card-top">
        <div class="card-tags">
          <span class="stamp-badge">${escapeHTML(r.category)}</span>
          <span class="stamp-badge cuisine">${escapeHTML(r.cuisine)}</span>
        </div>
        <span class="card-time">${cardTimeHTML(r)}</span>
      </div>
      <h3 class="card-title">${escapeHTML(r.title)}</h3>
      <div class="card-bottom">
        <span class="card-source">${escapeHTML(r.source||'')}</span>
        <span class="card-servings">${r.servings ? servingsLabel(r.servings) : ''}</span>
      </div>
    `;
    card.onclick = ()=> openModal(r);
    grid.appendChild(card);
  });
}

function render(){ renderChips(); renderGrid(); }

// minimal **bold** markdown -> <strong> renderer (escapes HTML first to stay safe)
function escapeHTML(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function renderInline(s){
  const escaped = escapeHTML(s);
  return escaped.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
}

function openModal(r){
  document.getElementById('modalEyebrow').innerHTML =
    `<span>${r.category}</span><span>${r.cuisine}</span>${r.prepTime ? `<span>Prep ${r.prepTime}</span>`:''}${r.cookTime ? `<span>Cook ${r.cookTime}</span>`:''}`;
  document.getElementById('modalTitle').textContent = r.title;
  document.getElementById('modalSource').textContent = [r.source, r.servings ? servingsLabel(r.servings) : null].filter(Boolean).join(' — ');

  const tagsWrap = document.getElementById('modalTags');
  tagsWrap.innerHTML = '';
  (r.tags||[]).forEach(t=>{
    const p = document.createElement('span');
    p.className = 'tagpill';
    p.textContent = t;
    tagsWrap.appendChild(p);
  });

  const ingWrap = document.getElementById('modalIngredients');
  ingWrap.innerHTML = '';
  (r.ingredients||[]).forEach(item=>{
    const li = document.createElement('li');
    const isHeading = item.endsWith(':') && item.split(' ').length < 6;
    if(isHeading){ li.className = 'heading'; }
    li.innerHTML = renderInline(item);
    ingWrap.appendChild(li);
  });

  const stepsWrap = document.getElementById('modalSteps');
  stepsWrap.innerHTML = '';
  (r.instructions||[]).forEach(step=>{
    const li = document.createElement('li');
    li.innerHTML = renderInline(step);
    stepsWrap.appendChild(li);
  });

  const notesWrap = document.getElementById('modalNotesWrap');
  notesWrap.innerHTML = r.notes ? `<div class="notes-box"><span class="notes-label">Notes &amp; Variations</span>${renderInline(r.notes)}</div>` : '';

  document.getElementById('modalOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal(){
  document.getElementById('modalOverlay').classList.remove('open');
  document.body.style.overflow = '';
}
document.getElementById('modalClose').onclick = closeModal;
document.getElementById('modalOverlay').onclick = (e)=>{ if(e.target.id==='modalOverlay') closeModal(); };
document.addEventListener('keydown', (e)=>{ if(e.key==='Escape') closeModal(); });

let searchTimer;
document.getElementById('searchInput').addEventListener('input', (e)=>{
  clearTimeout(searchTimer);
  const val = e.target.value;
  searchTimer = setTimeout(()=>{ state.query = val; renderGrid(); }, 80);
});

document.getElementById('clearFilters').onclick = ()=>{
  state = {query:"", category:null, cuisine:null};
  document.getElementById('searchInput').value = '';
  render();
};

render();

</script>
</body>
</html>
