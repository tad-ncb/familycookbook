    if(navigator.clipboard) navigator.clipboard.writeText(url).then(done, ()=>{ msg.textContent = url; });
    else msg.textContent = url;
  };
}

applyFont(fontIdx());
setTimeout(openFromHash, 0);

/* ============================================================
   PHASE 4 — Supabase backend: auth-gated planner, live sync,
   offline queue. Recipes stay public and static; everything a
   household member writes (cook log, plan, inventory, prefs)
   lives in Postgres behind row-level security keyed to three
   allow-listed emails.
   ============================================================ */

/* Fill these in from Supabase -> Settings -> API. The anon key is
   meant to be public; real access control is the RLS policy on
   each table (see supabase_setup.sql), not secrecy of this key. */
const SUPABASE_URL = 'https://kubvqmptumftqtfqrifs.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt1YnZxbXB0dW1mdHF0ZnFyaWZzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc1MDc0NzcsImV4cCI6MjEwMzA4MzQ3N30.uWvku48avh5aUIp6V7lwGoNz-nk6RT1SiHaKODyWI2Q';

const sb = (SUPABASE_URL.startsWith('http'))
  ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
  : null;

let session = null;
let realtimeChannel = null;

function isEditor(){ return !!session; }

/* ---------------- row <-> local shape mapping ---------------- */
function rowToCook(r){ return {id:r.id, recipeId:r.recipe_id, date:r.date, rating:r.rating, note:r.note||'', _d:!!r.deleted, _t:Date.parse(r.updated_at)}; }
function rowToPlan(r){ return {recipeId:r.recipe_id||undefined, leftoverOf:r.leftover_of||undefined, ritual:!!r.ritual, servings:r.servings||undefined, _d:!!r.deleted, _t:Date.parse(r.updated_at)}; }
function rowToInv(r){ return {id:r.id, name:r.name, qty:r.qty, unit:r.unit, _d:!!r.deleted, _t:Date.parse(r.updated_at)}; }

async function remoteFetchAll(){
  if(!sb || !session) return null;
  const [cl, pd, iv, pf] = await Promise.all([
    sb.from('cook_log').select('*'),
    sb.from('plan_days').select('*'),
    sb.from('inventory_items').select('*'),
    sb.from('prefs').select('*').eq('id', 1).single()
  ]);
  if(cl.error || pd.error || iv.error || pf.error){
    console.error('Supabase fetch error', cl.error||pd.error||iv.error||pf.error);
    return null;
  }
  const plan = {};
  pd.data.forEach(r=> plan[r.iso_date] = rowToPlan(r));
  const freezer = [], pantry = [];
  iv.data.forEach(r=> (r.kind==='freezer'?freezer:pantry).push(rowToInv(r)));
  return {
    version: 1,
    cookLog: cl.data.map(rowToCook),
    plan,
    inventory: {freezer, pantry, _t: Date.parse(pf.data.updated_at)},
    prefs: Object.assign({household: pf.data.household, rituals: pf.data.rituals||[]}, {_t: Date.parse(pf.data.updated_at)})
  };
}

/* ---------------- offline write queue ---------------- */
const QUEUE_KEY = 'cookbook.pendingWrites';
function loadQueue(){ try{ return JSON.parse(localStorage.getItem(QUEUE_KEY)) || []; }catch(e){ return []; } }
function saveQueue(q){ try{ localStorage.setItem(QUEUE_KEY, JSON.stringify(q)); }catch(e){} }
function enqueue(op){ const q = loadQueue(); q.push(op); saveQueue(q); }

async function runOp(op){
  if(op.table === 'cook_log'){
    return sb.from('cook_log').upsert({
      id: op.row.id, recipe_id: op.row.recipeId, date: op.row.date,
      rating: op.row.rating, note: op.row.note, deleted: !!op.row._d,
      updated_at: new Date(op.row._t).toISOString()
    });
  }
  if(op.table === 'plan_days'){
    return sb.from('plan_days').upsert({
      iso_date: op.iso, recipe_id: op.row.recipeId||null, leftover_of: op.row.leftoverOf||null,
      ritual: !!op.row.ritual, servings: op.row.servings||null, deleted: !!op.row._d,
      updated_at: new Date(op.row._t).toISOString()
    });
  }
  if(op.table === 'inventory_items'){
    return sb.from('inventory_items').upsert({
      id: op.row.id, kind: op.kind, name: op.row.name, qty: op.row.qty, unit: op.row.unit,
      deleted: !!op.row._d, updated_at: new Date(op.row._t).toISOString()
    });
  }
  if(op.table === 'prefs'){
    return sb.from('prefs').update({
      household: op.row.household, rituals: op.row.rituals, updated_at: new Date(op.row._t).toISOString()
    }).eq('id', 1);
  }
}

let flushing = false;
async function flushQueue(){
  if(!sb || !session || flushing) return;
  flushing = true;
  let q = loadQueue();
  while(q.length){
    const op = q[0];
    try{
      const {error} = await runOp(op);
      if(error) throw error;
      q.shift(); saveQueue(q);
    }catch(e){ break; }  /* still offline or a real error -- stop and retry later */
  }
  flushing = false;
  setSyncState(q.length ? 'error' : 'ok');
}
window.addEventListener('online', flushQueue);

/* every local mutation goes through here instead of writing straight
   to Supabase, so the UI never blocks on network and offline edits
   are never lost -- they just wait in the queue. */
function pushWrite(op){
  enqueue(op);
  flushQueue();
}

/* ---------------- realtime ---------------- */
function subscribeRealtime(){
  if(!sb || !session || realtimeChannel) return;
  realtimeChannel = sb.channel('household-sync')
    .on('postgres_changes', {event:'*', schema:'public', table:'cook_log'}, onRemoteChange)
    .on('postgres_changes', {event:'*', schema:'public', table:'plan_days'}, onRemoteChange)
    .on('postgres_changes', {event:'*', schema:'public', table:'inventory_items'}, onRemoteChange)
    .on('postgres_changes', {event:'*', schema:'public', table:'prefs'}, onRemoteChange)
    .subscribe();
}
function unsubscribeRealtime(){
  if(realtimeChannel){ sb.removeChannel(realtimeChannel); realtimeChannel = null; }
}
let remoteDebounce = null;
function onRemoteChange(){
  /* a full refetch-and-merge is simpler and plenty fast at family-cookbook scale
     compared to patching in one changed row at a time */
  clearTimeout(remoteDebounce);
  remoteDebounce = setTimeout(async ()=>{
    const remote = await remoteFetchAll();
    if(!remote) return;
    DATA = mergeStates(remote, DATA);
    persist(true);
    render();
    if(view==='plan') renderWeek();
    if(view==='history') renderMonth();
  }, 400);
}

/* ---------------- sync status pill ---------------- */
let syncState = 'off';
function setSyncState(s){ syncState = s; paintAuth(); }
function syncLabel(){
  return {off:'', ok:'● synced', error:'▲ retrying…', syncing:'◍ syncing…'}[syncState] || '';
}

/* ---------------- auth UI ---------------- */
function paintAuth(){
  const host = document.getElementById('authArea');
  if(!sb){ host.innerHTML = `<span class="icon-btn" style="cursor:default">Supabase not configured</span>`; return; }
  if(session){
    host.innerHTML = `<span class="icon-btn sync-dot s-${syncState==='error'?'error':'ok'}" style="cursor:default">${syncLabel()}</span>
      <button class="icon-btn" id="signOutBtn">Sign out (${escapeHTML(session.user.email)})</button>`;
    document.getElementById('signOutBtn').onclick = async ()=>{ await sb.auth.signOut(); };
  } else {
    host.innerHTML = `<button class="icon-btn" id="signInBtn">Sign in to plan &amp; track</button>`;
    document.getElementById('signInBtn').onclick = openAuthPanel;
  }
}
function openAuthPanel(){
  const host = document.getElementById('authPanel');
  if(host.dataset.open){ host.dataset.open=''; host.innerHTML=''; return; }
  host.dataset.open = '1';
  host.innerHTML = `<div class="bench"><div class="bench-inner">
      <h3>Sign in</h3>
      <p>Enter your email and we'll send a sign-in link. Only household emails can access the planner.</p>
      <div class="bench-btns">
        <input type="email" id="authEmail" placeholder="you@example.com" style="flex:1 1 220px; min-width:0; font-family:'Inter',sans-serif; font-size:14px; padding:7px 9px; border:1px solid var(--line); border-radius:3px; background:var(--card); color:var(--ink);">
        <button class="tb-btn" id="authSend">Send link</button>
      </div>
      <p id="authMsg" style="margin-top:10px;"></p>
    </div></div>`;
  document.getElementById('authSend').onclick = async ()=>{
    const email = document.getElementById('authEmail').value.trim();
    const msg = document.getElementById('authMsg');
    if(!email){ msg.textContent = 'Enter an email first.'; return; }
    msg.textContent = 'Sending…';
    const {error} = await sb.auth.signInWithOtp({email, options:{emailRedirectTo: location.origin + location.pathname}});
    msg.textContent = error ? ('Could not send link: ' + error.message) : 'Check your email for the sign-in link.';
  };
}

/* ---------------- boot ---------------- */
function applyAuthGate(){
  const signedIn = isEditor();
  document.querySelectorAll('#viewTabs .vt[data-view="plan"], #viewTabs .vt[data-view="history"]')
    .forEach(b=> b.style.display = signedIn ? '' : 'none');
  if(!signedIn && (view==='plan' || view==='history')) setView('cookbook');
}
async function authBoot(){
  if(!sb){ paintAuth(); applyAuthGate(); return; }
  const {data} = await sb.auth.getSession();
  session = data.session;
  paintAuth(); applyAuthGate();
  if(session){
    const remote = await remoteFetchAll();
    if(remote){ DATA = mergeStates(remote, DATA); persist(true); render(); }
    subscribeRealtime();
    flushQueue();
  }
  sb.auth.onAuthStateChange(async (event, newSession)=>{
    session = newSession;
    paintAuth(); applyAuthGate();
    if(session){
      const authPanel = document.getElementById('authPanel');
      authPanel.dataset.open=''; authPanel.innerHTML='';
      const remote = await remoteFetchAll();
      if(remote){ DATA = mergeStates(remote, DATA); persist(true); render(); if(view==='plan') renderWeek(); }
      subscribeRealtime();
      flushQueue();
    } else {
      unsubscribeRealtime();
    }
  });
}
authBoot();
