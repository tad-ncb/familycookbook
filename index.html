<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>The Deemer-Berdux Family Cookbook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* Dark is the default. [data-theme="light"] restores the original paper palette. */
  :root{
    --paper: #131210;
    --card: #1B1917;
    --card-hover: #221F1C;
    --ink: #F2EEE6;
    --ink-soft: #A29B8D;
    --ink-faint: #6E685D;
    --line: #302C27;
    --hair: #262320;
    --stamp: #9CBBD8;
    --stamp-soft: #1F2C38;
    --alert: #E29383;
    --alert-soft: #362320;
    --gold: #D6A94B;
    --today: #1E1C17;
    --past: #171512;
    --scrim: rgba(0,0,0,0.62);
    --shadow: 0 1px 3px rgba(0,0,0,0.4);
    --maxw: 1440px;
    --recipe-font: 13.5px;
    --step-font: 14px;
  }
  :root[data-theme="light"]{
    --paper: #FAF9F5;
    --card: #FFFFFF;
    --card-hover: #FDFCFA;
    --ink: #16130F;
    --ink-soft: #726C60;
    --ink-faint: #A39C8C;
    --line: #E7E2D5;
    --hair: #F1EDE2;
    --stamp: #2C4159;
    --stamp-soft: #E4E9EE;
    --alert: #8B3A2F;
    --alert-soft: #F3E4E0;
    --gold: #B8860B;
    --today: #FFFDF6;
    --past: #FBFAF7;
    --scrim: rgba(22,19,15,0.45);
    --shadow: 0 1px 3px rgba(22,19,15,0.06);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0; overflow-x:hidden; width:100%;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  ::selection{background:var(--stamp); color:#fff;}

  .masthead{ border-bottom:1px solid var(--line); }
  .masthead-inner{ max-width:var(--maxw); margin:0 auto; padding:clamp(18px,3vw,36px) clamp(12px,2.6vw,32px); text-align:center; }
  h1.title{
    font-family:'Inter',sans-serif; font-weight:700;
    font-size:clamp(28px, 3.6vw, 42px); line-height:1.1;
    letter-spacing:-0.01em; margin:0; color:var(--ink);
  }

  .controls{ max-width:var(--maxw); margin:0 auto; padding:clamp(14px,2.2vw,22px) clamp(12px,2.6vw,32px) clamp(12px,2vw,20px); }
  .search-row{
    display:flex; align-items:center; gap:16px;
    border-bottom:1.5px solid var(--ink); padding-bottom:12px;
  }
  .search-row svg{opacity:0.45; flex:0 0 auto;}
  .search-row input{
    border:none; outline:none; background:transparent;
    font-family:'Inter',sans-serif; font-weight:500;
    font-size:clamp(16px, 2.2vw, 19px); color:var(--ink); width:100%; min-width:0;
  }
  .search-row input::placeholder{color:var(--ink-faint); font-weight:400;}
  .result-count{
    font-family:'IBM Plex Mono', monospace; font-size:11px;
    color:var(--ink-soft); white-space:nowrap;
  }

  .facet-rows{ margin-top:18px; display:flex; flex-direction:column; gap:10px; }
  .facet-row{ display:flex; align-items:baseline; flex-wrap:wrap; gap:4px 4px; }
  .facet-name{
    font-family:'IBM Plex Mono', monospace; font-size:10.5px;
    text-transform:uppercase; letter-spacing:0.12em; color:var(--ink-faint);
    width:80px; flex:0 0 auto;
  }
  .facet-link{
    font-family:'Inter',sans-serif; font-size:clamp(12.5px, 1.6vw, 13.5px); color:var(--ink-soft);
    padding:4px 10px; cursor:pointer; border-bottom:1px solid transparent;
    white-space:nowrap; transition:color .12s ease, border-color .12s ease;
  }
  .facet-link:hover{color:var(--ink);}
  .facet-link.active{ color:var(--stamp); border-bottom:1px solid var(--stamp); font-weight:600; }
  .facet-link .n{color:var(--ink-faint); font-size:11px;}
  .facet-link.active .n{color:var(--stamp); opacity:0.6;}

  .clear-link{
    font-family:'IBM Plex Mono', monospace; font-size:10.5px;
    text-transform:uppercase; letter-spacing:0.08em; color:var(--ink-faint);
    cursor:pointer; text-decoration:underline; text-underline-offset:3px; margin-left:4px;
  }
  .clear-link:hover{color:var(--alert);}

  .grid{
    max-width:var(--maxw); margin:0 auto; padding:8px 24px 100px;
    display:grid; grid-template-columns:repeat(auto-fill, minmax(min(100%, 265px), 1fr));
    gap:1px; background:var(--line); border:1px solid var(--line);
  }
  .empty-state{
    grid-column:1/-1; text-align:center; padding:90px 20px; color:var(--ink-soft);
    font-family:'Inter',sans-serif; font-style:italic; font-size:18px; background:var(--paper);
  }

  .card{
    background:var(--card); padding:18px 18px 16px; cursor:pointer;
    display:flex; flex-direction:column; min-height:196px; position:relative;
    transition:background .12s ease; min-width:0; overflow-x:hidden;
  }
  .card:hover{background:var(--card-hover);}
  .card:hover .card-title{color:var(--stamp);}
  .card-top{ display:flex; flex-wrap:wrap; align-items:flex-start; margin-bottom:10px; gap:6px; }
  .card-tags{ display:flex; flex-wrap:wrap; gap:5px; min-width:0; }
  .stamp-badge{
    font-family:'IBM Plex Mono', monospace; font-size:9px; text-transform:uppercase;
    letter-spacing:0.07em; color:var(--stamp); border:1px solid var(--stamp);
    padding:3px 7px; border-radius:2px; white-space:nowrap;
  }
  .stamp-badge.cuisine{
    color:var(--ink-soft); border-color:var(--line); background:var(--stamp-soft);
  }
  /* time sits on its own row and wraps -- it used to be nowrap beside the
     badges, which overflowed once the total + split were both shown */
  .card-time{
    font-family:'IBM Plex Mono', monospace; font-size:9.5px;
    color:var(--ink-faint); line-height:1.5; letter-spacing:0.03em;
    display:flex; flex-wrap:wrap; gap:2px 8px; margin-bottom:7px;
  }
  .card-time .t-total{ color:var(--ink-soft); font-weight:600; }
  .card-title{
    font-family:'Inter',sans-serif; font-weight:600; font-size:17.5px;
    line-height:1.22; margin:0 0 8px; transition:color .12s ease;
    overflow-wrap:anywhere;
  }
  .card-bottom{
    margin-top:auto; padding-top:12px; border-top:1px solid var(--line);
    display:flex; flex-wrap:wrap; justify-content:space-between; align-items:baseline; gap:3px 10px;
  }
  .card-source{
    font-family:'Inter',sans-serif; font-style:italic; font-size:12px; color:var(--ink-soft);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    flex:1 1 auto; min-width:0;
  }
  .card-servings{
    font-family:'IBM Plex Mono', monospace; font-size:10px; color:var(--ink-faint);
    white-space:nowrap; flex:0 0 auto;
  }

  .modal-overlay{
    position:fixed; inset:0; background:var(--scrim); display:none;
    align-items:flex-start; justify-content:center; z-index:100;
    padding:clamp(0px, 3vw, 40px) clamp(0px, 2vw, 16px); overflow-y:auto;
  }
  .modal-overlay.open{display:flex;}
  .modal{
    background:var(--card); max-width:880px; width:100%; box-sizing:border-box;
    box-shadow:0 40px 80px rgba(0,0,0,0.25); position:relative; overflow-x:hidden;
    animation:modalIn .2s cubic-bezier(.2,.8,.3,1); margin-bottom:40px; border-top:3px solid var(--stamp);
  }
  @keyframes modalIn{ from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }
  .modal-inner{padding:clamp(20px, 3.5vw, 32px) clamp(16px, 4vw, 40px) 40px;}
  .modal-close{
    position:absolute; top:18px; right:18px; width:30px; height:30px;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    font-size:19px; color:var(--ink-soft); line-height:1; font-family:'IBM Plex Mono', monospace;
  }
  .modal-close:hover{color:var(--ink);}
  .modal-top{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:14px; }
  .modal-eyebrow{
    font-family:'IBM Plex Mono', monospace; font-size:10.5px; text-transform:uppercase;
    letter-spacing:0.09em; color:var(--ink-soft); display:flex; gap:14px; flex-wrap:wrap;
  }
  .modal h2{
    font-family:'Inter',sans-serif; font-weight:700; font-size:clamp(21px, 5vw, 28px);
    line-height:1.14; margin:0 0 6px; padding-right:20px; overflow-wrap:anywhere;
  }
  .modal .source-line{
    font-family:'Inter',sans-serif; font-style:italic; color:var(--ink-soft); font-size:13.5px;
    margin-bottom:16px; padding-bottom:16px; border-bottom:1px solid var(--line);
  }
  .tags{display:flex; gap:6px; flex-wrap:wrap; margin:8px 0 0;}
  .tagpill{
    font-family:'IBM Plex Mono', monospace; font-size:9.5px; text-transform:uppercase;
    letter-spacing:0.05em; border:1px solid var(--line); padding:2px 9px; color:var(--ink-soft);
  }
  .section-title{
    font-family:'IBM Plex Mono', monospace; font-size:10.5px; text-transform:uppercase;
    letter-spacing:0.11em; color:var(--stamp); margin:22px 0 10px;
  }
  .ing-list{list-style:none; margin:0; padding:0; columns:2; column-gap:32px;}
  .ing-list li{
    padding:5px 0 5px 20px; position:relative; font-size:var(--recipe-font);
    line-height:1.35; border-bottom:1px solid var(--hair); break-inside:avoid; overflow-wrap:anywhere;
  }
  .ing-list li.heading{
    font-weight:700; font-family:'IBM Plex Mono', monospace; font-size:10px;
    text-transform:uppercase; letter-spacing:0.06em; color:var(--ink-soft);
    padding-left:0; border-bottom:none; margin-top:10px; column-span:all;
  }
  .ing-list li.heading:first-child{margin-top:0;}
  .ing-list li:not(.heading)::before{
    content:""; position:absolute; left:1px; top:13px; width:5px; height:5px;
    background:var(--stamp); border-radius:50%; opacity:0.55;
  }
  .steps{list-style:none; counter-reset:step; margin:0; padding:0;}
  .steps li{ counter-increment:step; padding:0 0 13px 34px; position:relative; font-size:var(--step-font); line-height:1.45; overflow-wrap:anywhere; }
  .steps li::before{
    content:counter(step); position:absolute; left:0; top:0;
    font-family:'Inter',sans-serif; font-weight:700; font-size:14px; color:var(--stamp);
  }
  .steps li strong{ font-weight:700; color:var(--ink); }
  .notes-box{
    margin-top:20px; background:var(--stamp-soft); padding:13px 18px;
    border-radius:2px; font-size:13px; line-height:1.42; color:#1c2c3d;
  }
  .notes-box .notes-label{
    font-family:'IBM Plex Mono', monospace; font-size:9.5px; text-transform:uppercase;
    letter-spacing:0.08em; color:var(--stamp); margin-bottom:6px; display:block;
  }

  footer{
    text-align:center; padding:30px 20px 60px; font-family:'IBM Plex Mono', monospace;
    font-size:11px; color:var(--ink-faint); letter-spacing:0.03em;
  }

  @media (max-width:640px){
    .masthead-inner{padding:24px 20px;}
    .controls{padding:18px 20px 20px;}
    .grid{padding:8px 10px 90px; grid-template-columns:1fr; gap:1px;}
    .card{min-height:auto; padding:15px 15px 13px;}
    .ing-list{columns:1;}
    .facet-name{width:100%; margin-bottom:2px;}
    .modal{border-top-width:2px;}
    .modal-close{top:10px; right:10px; width:36px; height:36px; font-size:22px;}
  }
  /* ---------- Phase 1: tracking + scaling ---------- */
  .toolbar{
    max-width:var(--maxw); margin:0 auto; padding:0 clamp(12px,2.6vw,32px) 18px;
    display:flex; flex-wrap:wrap; align-items:center; gap:10px 18px;
  }
  .toolbar .tb-group{ display:flex; align-items:center; gap:8px; }
  .toolbar label.tb-name{
    font-family:'IBM Plex Mono', monospace; font-size:10px; text-transform:uppercase;
    letter-spacing:0.09em; color:var(--ink-faint);
  }
  select.tb-select{
    font-family:'Inter',sans-serif; font-size:13px; color:var(--ink);
    background:var(--card); border:1px solid var(--line); border-radius:3px;
    padding:5px 8px; cursor:pointer;
  }
  .tb-spacer{ flex:1 1 auto; }
  button.tb-btn{
    font-family:'IBM Plex Mono', monospace; font-size:10px; text-transform:uppercase;
    letter-spacing:0.07em; color:var(--ink-soft); background:var(--card);
    border:1px solid var(--line); border-radius:3px; padding:6px 10px; cursor:pointer;
  }
  button.tb-btn:hover{ color:var(--stamp); border-color:var(--stamp); }
  button.tb-btn.on{ color:#fff; background:var(--stamp); border-color:var(--stamp); }

  .card-meta{
    display:flex; align-items:center; gap:5px 8px; flex-wrap:wrap;
    margin:0 0 10px; font-family:'IBM Plex Mono', monospace; font-size:9.5px;
    color:var(--ink-faint); letter-spacing:0.04em; line-height:1.5;
  }
  .made-badge{ color:var(--stamp); }
  .made-badge.never{ color:var(--ink-faint); }
  .stars{ color:var(--gold); letter-spacing:0.5px; }
  .ahead-pill{
    font-family:'IBM Plex Mono', monospace; font-size:9px; text-transform:uppercase;
    letter-spacing:0.07em; color:var(--alert); background:var(--alert-soft);
    border:1px solid var(--alert); border-radius:2px; padding:2px 6px; white-space:nowrap;
  }

  /* scaling */
  .scale-bar{
    display:flex; align-items:center; flex-wrap:wrap; gap:10px;
    border:1px solid var(--line); background:var(--paper);
    border-radius:3px; padding:9px 12px; margin:2px 0 14px;
  }
  .scale-bar .sb-label{
    font-family:'IBM Plex Mono', monospace; font-size:10px; text-transform:uppercase;
    letter-spacing:0.08em; color:var(--ink-faint);
  }
  .scale-bar.active{ border-color:var(--stamp); background:var(--stamp-soft); }
  .scale-bar.active .sb-label{ color:var(--stamp); }
  .step{ display:flex; align-items:center; gap:0; }
  .step button{
    width:26px; height:26px; line-height:1; font-size:15px; cursor:pointer;
    background:var(--card); border:1px solid var(--line); color:var(--ink);
  }
  .step button:first-child{ border-radius:3px 0 0 3px; }
  .step button:last-child{ border-radius:0 3px 3px 0; }
  .step .step-val{
    min-width:54px; text-align:center; padding:0 8px; height:26px; line-height:26px;
    border-top:1px solid var(--line); border-bottom:1px solid var(--line);
    background:var(--card); font-family:'Inter',sans-serif; font-size:13px; font-weight:600;
  }
  .mult-btn{
    font-family:'IBM Plex Mono', monospace; font-size:10px; cursor:pointer;
    background:var(--card); border:1px solid var(--line); border-radius:3px;
    padding:5px 9px; color:var(--ink-soft);
  }
  .mult-btn:hover{ color:var(--stamp); border-color:var(--stamp); }
  .mult-btn.on{ color:#fff; background:var(--stamp); border-color:var(--stamp); }
  .unscaled-note{ color:var(--ink-faint); font-size:11px; font-style:italic; white-space:nowrap; }

  /* cooked panel */
  .cook-panel{ border-top:1px solid var(--line); margin-top:26px; padding-top:18px; }
  .cook-row{ display:flex; flex-wrap:wrap; align-items:center; gap:10px; }
  .cook-btn{
    font-family:'IBM Plex Mono', monospace; font-size:11px; text-transform:uppercase;
    letter-spacing:0.07em; color:#fff; background:var(--stamp); border:1px solid var(--stamp);
    border-radius:3px; padding:8px 14px; cursor:pointer;
  }
  .cook-btn:hover{ opacity:.88; }
  .cook-form{ display:none; margin-top:12px; gap:10px; flex-wrap:wrap; align-items:center; }
  .cook-form.open{ display:flex; }
  .cook-form input[type=date], .cook-form input[type=text]{
    font-family:'Inter',sans-serif; font-size:13px; padding:6px 8px;
    border:1px solid var(--line); border-radius:3px; background:var(--card); color:var(--ink);
  }
  .cook-form input[type=text]{ flex:1 1 220px; }
  .rate-pick{ display:flex; gap:2px; cursor:pointer; font-size:17px; color:var(--line); }
  .rate-pick span:hover, .rate-pick span.lit{ color:var(--gold); }
  .cook-hist{ margin-top:14px; display:flex; flex-direction:column; gap:7px; }
  .cook-hist-item{
    display:flex; align-items:baseline; gap:10px; flex-wrap:wrap;
    font-size:13px; color:var(--ink-soft); padding-bottom:7px; border-bottom:1px dotted var(--line);
  }
  .cook-hist-item .ch-date{ font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--ink); }
  .cook-hist-item .ch-note{ font-style:italic; }
  .ch-del{ margin-left:auto; cursor:pointer; color:var(--ink-faint); font-size:11px; }
  .ch-del:hover{ color:var(--alert); }
  .cook-empty{ color:var(--ink-faint); font-style:italic; font-size:13px; margin-top:10px; }
  .ahead-callout{
    margin:0 0 14px; padding:9px 12px; border-left:3px solid var(--alert);
    background:var(--alert-soft); font-size:13px; color:var(--ink);
  }
  @media (max-width:640px){
    .toolbar{ padding:0 14px 14px; }
  }
  /* ---------- Phase 2: planner + history ---------- */
  .viewtabs{ display:flex; justify-content:center; gap:4px; margin-top:18px; }
  .viewtabs .vt{
    font-family:'IBM Plex Mono', monospace; font-size:10.5px; text-transform:uppercase;
    letter-spacing:0.09em; color:var(--ink-soft); background:transparent;
    border:1px solid var(--line); border-radius:3px; padding:7px 14px; cursor:pointer;
  }
  .viewtabs .vt:hover{ color:var(--stamp); border-color:var(--stamp); }
  .viewtabs .vt.on{ color:#fff; background:var(--ink); border-color:var(--ink); }

  .planwrap{ max-width:var(--maxw); margin:0 auto; padding:22px clamp(12px,2.6vw,32px) 100px; }
  .plan-head{ display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin-bottom:16px; }
  .plan-nav{ display:flex; align-items:center; gap:6px; }
  .plan-range{
    font-family:'Inter',sans-serif; font-weight:600; font-size:17px;
    padding:0 8px; white-space:nowrap;
  }
  .week{
    display:grid; grid-template-columns:repeat(7, 1fr);
    gap:1px; background:var(--line); border:1px solid var(--line);
  }
  .day{ background:var(--card); min-height:210px; display:flex; flex-direction:column; padding:10px 11px 12px; }
  .day.today{ background:var(--today); box-shadow:inset 0 3px 0 var(--stamp); }
  .day.past{ background:var(--past); }
  .day-head{
    display:flex; justify-content:space-between; align-items:baseline;
    font-family:'IBM Plex Mono', monospace; font-size:10px; text-transform:uppercase;
    letter-spacing:0.08em; color:var(--ink-faint); margin-bottom:9px;
  }
  .day-head .dnum{ font-size:13px; color:var(--ink); letter-spacing:0; }
  .slot-empty{
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
  }
  .slot-empty button{
    font-family:'IBM Plex Mono', monospace; font-size:10px; color:var(--ink-faint);
    background:transparent; border:1px dashed var(--line); border-radius:3px;
    padding:6px 10px; cursor:pointer; width:100%;
  }
  .slot-empty button:hover{ color:var(--stamp); border-color:var(--stamp); }
  .slot{ flex:1; display:flex; flex-direction:column; }
  .slot-title{
    font-family:'Inter',sans-serif; font-weight:600; font-size:14px; line-height:1.25;
    cursor:pointer; margin-bottom:6px;
  }
  .slot-title:hover{ color:var(--stamp); }
  .slot-meta{
    font-family:'IBM Plex Mono', monospace; font-size:9px; color:var(--ink-faint);
    letter-spacing:0.04em; display:flex; flex-wrap:wrap; gap:5px; margin-bottom:auto;
  }
  .slot-actions{ display:flex; flex-wrap:wrap; gap:4px; margin-top:9px; }
  .slot-actions button{
    font-family:'IBM Plex Mono', monospace; font-size:9px; text-transform:uppercase;
    letter-spacing:0.05em; color:var(--ink-soft); background:var(--paper);
    border:1px solid var(--line); border-radius:2px; padding:4px 6px; cursor:pointer;
  }
  .slot-actions button:hover{ color:var(--stamp); border-color:var(--stamp); }
  .slot-actions button.done{ color:#fff; background:var(--stamp); border-color:var(--stamp); }
  .slot.leftover .slot-title{ font-style:italic; color:var(--ink-soft); font-weight:500; }
  .lo-pill{
    font-family:'IBM Plex Mono', monospace; font-size:8.5px; text-transform:uppercase;
    letter-spacing:0.07em; background:var(--stamp-soft); color:var(--stamp);
    border-radius:2px; padding:2px 5px;
  }
  .cooked-flag{ color:var(--stamp); }

  .prep-strip{
    border:1px solid var(--alert); background:var(--alert-soft);
    border-radius:3px; padding:11px 14px; margin-bottom:14px; font-size:13.5px;
  }
  .prep-strip b{ font-weight:600; }
  .prep-strip .pline{ margin-top:5px; }
  .prep-strip .pline:first-of-type{ margin-top:8px; }

  .week-summary{
    display:flex; flex-wrap:wrap; gap:18px; margin-top:16px; padding-top:14px;
    border-top:1px solid var(--line);
    font-family:'IBM Plex Mono', monospace; font-size:10.5px; color:var(--ink-soft);
    letter-spacing:0.04em;
  }
  .week-summary b{ color:var(--ink); font-weight:600; }

  /* shopping + prep panel */
  .shop{ margin-top:22px; border:1px solid var(--line); background:var(--card); padding:20px 22px; }
  .shop h3{
    font-family:'IBM Plex Mono', monospace; font-size:11px; text-transform:uppercase;
    letter-spacing:0.1em; color:var(--ink-soft); margin:0 0 14px; font-weight:500;
  }
  .shop-cols{ columns:3; column-gap:32px; }
  .shop-sec{ break-inside:avoid; margin-bottom:16px; }
  .shop-sec h4{
    font-family:'IBM Plex Mono', monospace; font-size:10px; text-transform:uppercase;
    letter-spacing:0.08em; color:var(--stamp); margin:0 0 6px; font-weight:500;
    border-bottom:1px solid var(--line); padding-bottom:4px;
  }

  .shop-sec li{ font-size:13px; line-height:1.5; color:var(--ink); padding:1px 0; }

  /* month / history */
  .month{ display:grid; grid-template-columns:repeat(7,1fr); gap:1px; background:var(--line); border:1px solid var(--line); }

  }

  .mcell .mnum{ font-family:'IBM Plex Mono', monospace; font-size:10px; color:var(--ink-faint); }
  .mcell .mitem{ font-size:11.5px; line-height:1.3; margin-top:4px; color:var(--ink); cursor:pointer; }
  .mcell .mitem:hover{ color:var(--stamp); }
  .mcell .mstars{ color:var(--gold); font-size:9px; }
  .hist-stats{ display:flex; flex-wrap:wrap; gap:26px; margin-bottom:16px; }
  .hstat{ font-family:'IBM Plex Mono', monospace; font-size:10.5px; color:var(--ink-faint); letter-spacing:0.05em; }
  .hstat b{ display:block; font-family:'Inter',sans-serif; font-size:23px; color:var(--ink); letter-spacing:-0.01em; }

  /* picker */
  .picker-search{ display:flex; flex-wrap:wrap; align-items:center; gap:14px; margin:6px 0 14px; }
  .picker-search input[type=text]{
    flex:1 1 180px; min-width:0; font-family:'Inter',sans-serif; font-size:15px; padding:8px 10px;
    border:1px solid var(--line); border-radius:3px; background:var(--card); color:var(--ink);
  }
  .picker-search label{ display:flex; align-items:center; gap:5px; cursor:pointer; }
  .picker-list{ max-height:46vh; overflow-y:auto; border-top:1px solid var(--line); }
  .prow{
    display:flex; align-items:baseline; gap:10px; padding:9px 4px;
    border-bottom:1px solid var(--line); cursor:pointer;
  }
  .prow:hover{ background:var(--paper); }
  .prow .pt{ font-weight:600; font-size:14.5px; flex:1; }
  .prow .pm{ font-family:'IBM Plex Mono', monospace; font-size:9.5px; color:var(--ink-faint); white-space:nowrap; }
  .prow .why{ font-family:'IBM Plex Mono', monospace; font-size:9px; color:var(--stamp); white-space:nowrap; }
  .picker-sug{
    margin-bottom:12px; padding:12px 14px; background:var(--stamp-soft);
    border:1px solid var(--stamp); border-radius:3px;
  }
  .picker-sug h4{
    font-family:'IBM Plex Mono', monospace; font-size:10px; text-transform:uppercase;
    letter-spacing:0.08em; color:var(--stamp); margin:0 0 8px; font-weight:500;
  }

  @media (max-width:1000px){
    .week{ grid-template-columns:repeat(2,1fr); }
    .shop-cols{ columns:2; }
  }
  @media (max-width:640px){
    .planwrap{ padding:16px 14px 90px; }

    .shop-cols{ columns:1; }
    .mcell{ min-height:64px; }
  }

    border:1px solid var(--line); background:var(--card);
    padding:18px 20px; margin-bottom:16px;
  }

    font-family:'IBM Plex Mono', monospace; font-size:11px; text-transform:uppercase;
    letter-spacing:0.1em; color:var(--ink-soft); margin:0 0 4px; font-weight:500;
  }
  .settings p.hint{ font-size:13px; color:var(--ink-soft); margin:0 0 14px; font-style:italic; }
  .ritual-row{
    display:flex; align-items:center; gap:10px; padding:6px 0;
    border-bottom:1px dotted var(--line);
  }

    font-family:'IBM Plex Mono', monospace; font-size:10px; text-transform:uppercase;
    letter-spacing:0.08em; color:var(--ink); width:42px; flex:0 0 auto;
  }
  .ritual-row select{
    flex:1 1 auto; min-width:0; font-family:'Inter',sans-serif; font-size:13px;
    padding:5px 7px; border:1px solid var(--line); border-radius:3px;
    background:var(--card); color:var(--ink);
  }
  .house-row{ display:flex; align-items:center; gap:10px; margin-top:16px; padding-top:14px; border-top:1px solid var(--line); }
  .house-row .rday{ font-family:'IBM Plex Mono', monospace; font-size:10px; text-transform:uppercase; letter-spacing:0.08em; }
  /* ---------- Phase 3: theme, making mode, mobile chrome ---------- */
  .util-row{
    max-width:var(--maxw); margin:0 auto;
    padding:0 clamp(12px,2.6vw,32px) 26px;
    display:flex; align-items:center; gap:10px; justify-content:center;
  }
  .icon-btn{
    background:transparent; border:1px solid var(--line); border-radius:3px;
    color:var(--ink-faint); cursor:pointer; padding:5px 9px; line-height:1;
    font-family:'IBM Plex Mono', monospace; font-size:11px;
  }
  .icon-btn:hover{ color:var(--stamp); border-color:var(--stamp); }
  .icon-btn.on{ color:#fff; background:var(--stamp); border-color:var(--stamp); }

  /* the workbench: computer-only data plumbing, hidden until asked for */
  .bench{
    max-width:var(--maxw); margin:0 auto 26px;
    padding:16px clamp(12px,2.6vw,32px);
  }
  .bench-inner{
    border:1px dashed var(--line); background:var(--card); padding:16px 18px;
  }
  .bench h3{
    font-family:'IBM Plex Mono', monospace; font-size:10.5px; text-transform:uppercase;

  }
  .bench p{ font-size:13px; color:var(--ink-soft); margin:0 0 12px; line-height:1.5; }
  .bench-btns{ display:flex; flex-wrap:wrap; gap:8px; }

  /* --- scale bar: fixed columns so nothing shifts when values change --- */
  .scale-bar{
    display:flex; align-items:center; flex-wrap:wrap; gap:10px 16px;
    border:1px solid var(--line); background:var(--paper);
    border-radius:3px; padding:10px 13px; margin:2px 0 14px;
  }
  .sb-block{ display:flex; align-items:center; gap:8px; }
  .sb-key{
    font-family:'IBM Plex Mono', monospace; font-size:10px; text-transform:uppercase;
    letter-spacing:0.08em; color:var(--ink-faint); flex:0 0 auto;
  }
  .sb-mults{ display:flex; gap:4px; }
  .sb-yield{
    font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--ink-soft);
    white-space:nowrap;
  }
  .sb-flag{
    font-family:'IBM Plex Mono', monospace; font-size:9px; text-transform:uppercase;
    letter-spacing:0.07em; color:var(--stamp); border:1px solid var(--stamp);
    background:var(--stamp-soft); border-radius:2px; padding:2px 6px; white-space:nowrap;
  }
  .step .step-val{
    min-width:46px; text-align:center; padding:0 6px; height:26px; line-height:26px;
    border-top:1px solid var(--line); border-bottom:1px solid var(--line);
    background:var(--card); font-family:'IBM Plex Mono', monospace;
    font-size:13px; font-weight:600; font-variant-numeric:tabular-nums; color:var(--ink);
  }

  /* --- making mode --- */
  .make-bar{
    display:flex; align-items:center; flex-wrap:wrap; gap:8px 14px;
    margin:18px 0 4px; padding:10px 13px;
    border:1px solid var(--line); border-radius:3px; background:var(--paper);
  }
  .make-bar.on{ border-color:var(--stamp); background:var(--stamp-soft); }
  .make-prog{
    font-family:'IBM Plex Mono', monospace; font-size:10.5px; color:var(--ink-soft);
    font-variant-numeric:tabular-nums;
  }
  .fontsize{ display:flex; gap:3px; align-items:center; }
  .fontsize button{
    background:var(--card); border:1px solid var(--line); border-radius:3px;
    color:var(--ink-soft); cursor:pointer; padding:3px 8px; line-height:1.2;
    font-family:'Inter',sans-serif;
  }
  .fontsize button:hover{ color:var(--stamp); border-color:var(--stamp); }
  .fontsize .fs-a{ font-size:11px; } .fontsize .fs-b{ font-size:14px; } .fontsize .fs-c{ font-size:17px; }

  /* checkable ingredients + steps while cooking */
  .making .ing-list li:not(.heading), .making .steps li{ cursor:pointer; }
  .making .ing-list li:not(.heading){ padding-left:28px; }
  .making .ing-list li:not(.heading)::before{
    content:""; left:2px; top:calc(0.5em + 3px); width:13px; height:13px; border-radius:3px;
    background:transparent; border:1.5px solid var(--ink-faint); opacity:1;
  }
  .making .ing-list li.tick{ color:var(--ink-faint); text-decoration:line-through; }
  .making .ing-list li.tick::before{
    background:var(--stamp); border-color:var(--stamp);
  }
  .making .steps li.tick{ color:var(--ink-faint); }
  .making .steps li.tick::before{ color:var(--ink-faint); text-decoration:line-through; }
  .making .steps li::after{
    content:""; position:absolute; left:0; top:2px; width:22px; height:22px;
    border-radius:3px; pointer-events:none;
  }
  .making .steps li.tick::after{ background:var(--stamp); opacity:0.1; }

  .modal-actions{
    display:flex; flex-wrap:wrap; gap:8px; align-items:center;
    margin:16px 0 0; padding-top:14px; border-top:1px solid var(--line);
  }

  @media (max-width:760px){
    .grid{ grid-template-columns:1fr; }
    .viewtabs{ flex-wrap:wrap; }
    .viewtabs .vt{ flex:1 1 auto; min-width:88px; }
    .facet-row{ gap:2px; }
    .facet-link{ padding:5px 8px; }
    .toolbar{ gap:8px 12px; }
    .toolbar .tb-group{ flex-wrap:wrap; }
    .scale-bar{ gap:8px 12px; }
    .sb-block{ flex:0 0 auto; }
    .ing-list{ columns:1; }
    .make-bar{ gap:8px 10px; }
  }
  .sync-dot{ font-size:10.5px; letter-spacing:0.04em; }
  .sync-dot.s-ok, .sync-dot.s-idle{ color:#5FA36B; border-color:#5FA36B33; }
  .sync-dot.s-syncing{ color:var(--stamp); border-color:var(--stamp); }
  .sync-dot.s-error{ color:var(--alert); border-color:var(--alert); }
  .bench code{ font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--stamp); }
</style>
</head>

<script>
/* ============================================================

   ============================================================ */
const SEED_STATE = {
  "version": 1,
  "cookLog": [],
  "plan": {},
  "inventory": { "freezer": [], "pantry": [] },
  "prefs": {}
};

/* ---------------- state layer ---------------- */
const LS_KEY = 'cookbook.state.v1';
function blankState(){ return {version:1, cookLog:[], plan:{}, inventory:{freezer:[],pantry:[]}, prefs:{}}; }
/* Deletes are tombstones (_d) rather than removals, and every mutable record carries
   a _t stamp -- without both, a delete on one device is silently undone by the other. */
function newer(x, y){ return ((y && y._t)||0) >= ((x && x._t)||0) ? y : x; }
function mergeStates(base, over){
  const m = new Map();
  [...(base.cookLog||[]), ...(over.cookLog||[])].forEach(e=>{
    if(!e || !e.id) return;
    const prev = m.get(e.id);
    m.set(e.id, prev ? newer(prev, e) : e);
  });
  const plan = {};
  const keys = new Set([...Object.keys(base.plan||{}), ...Object.keys(over.plan||{})]);
  keys.forEach(k=>{
    const x = (base.plan||{})[k], y = (over.plan||{})[k];
    const win = (!x) ? y : (!y) ? x : newer(x, y);
    /* let old tombstones fall away so the file doesn't grow forever */
    if(win && win._d && (Date.now() - (win._t||0)) > 60*864e5) return;
    plan[k] = win;
  });
  const bi = base.inventory || {}, oi = over.inventory || {};
  const inv = ((oi._t||0) >= (bi._t||0)) ? oi : bi;
  const bp = base.prefs || {}, op = over.prefs || {};
  return {
    version: 1,
    cookLog: [...m.values()].sort((a,b)=> (b.date||'').localeCompare(a.date||'')),
    plan,
    inventory: {freezer: inv.freezer||[], pantry: inv.pantry||[], _t: inv._t||0},
    prefs: ((op._t||0) >= (bp._t||0)) ? Object.assign({}, bp, op) : Object.assign({}, op, bp)
  };
}
function loadLocal(){ try{ const r=localStorage.getItem(LS_KEY); return r?JSON.parse(r):null; }catch(e){ return null; } }
let DATA = mergeStates(SEED_STATE, loadLocal() || blankState());
function persist(fromSync){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(DATA)); }catch(e){}
  if(!fromSync && typeof scheduleSync === 'function') scheduleSync();
}
function uid(){ return 'c'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

function cookEvents(id){ return DATA.cookLog.filter(e=>e.recipeId===id && !e._d).sort((a,b)=>(b.date||'').localeCompare(a.date||'')); }
function timesMade(id){ return cookEvents(id).length; }
function lastMade(id){ const e=cookEvents(id); return e.length ? e[0].date : null; }
function avgRating(id){
  const rs = cookEvents(id).map(e=>e.rating).filter(n=>typeof n==='number' && n>0);
  return rs.length ? rs.reduce((a,b)=>a+b,0)/rs.length : null;
}
function addCook(recipeId, date, rating, note){
  const row = {id:uid(), recipeId, date, rating: rating||null, note: note||'', _t: Date.now()};
  DATA.cookLog.unshift(row);
  DATA.cookLog.sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  persist();
  if(typeof pushWrite === 'function') pushWrite({table:'cook_log', row});
}
function removeCook(evId){
  const e = DATA.cookLog.find(x=>x.id===evId);
  if(e){ e._d = true; e._t = Date.now(); }
  persist();
  if(e && typeof pushWrite === 'function') pushWrite({table:'cook_log', row:e});
}

function todayISO(){ const d=new Date(); return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10); }
function daysSince(iso){
  if(!iso) return null;
  const a=new Date(iso+'T00:00:00'), b=new Date(todayISO()+'T00:00:00');
  return Math.round((b-a)/86400000);
}
function relTime(iso){
  const d = daysSince(iso);
  if(d===null) return '';
  if(d<=0) return 'today';
  if(d===1) return 'yesterday';
  if(d<7) return d+' days ago';
  if(d<14) return 'last week';
  if(d<61) return Math.round(d/7)+' weeks ago';
  if(d<365) return Math.round(d/30)+' months ago';
  const y=Math.round(d/365); return y===1?'a year ago':y+' years ago';
}

/* ---------------- formatting helpers ---------------- */
function escapeHTML(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
/* zero-width space after slashes -> lets long titles/cuisines wrap without a visible gap */
function zwsp(s){ return String(s).replace(/\/(?!​)/g, '/​'); }
function renderInline(s){ return zwsp(escapeHTML(s)).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>'); }
function displayTitle(r){ return r.shortTitle || r.title; }

/* ---------------- time parsing ---------------- */
function roundUp5(n){ return Math.ceil(n/5)*5; }
function parseTime(str){
  if(!str) return null;
  const s = String(str).toLowerCase();
  let qual = null;
  if(/\b(under|less than|up to)\b/.test(s)) qual = 'under';
  else if(/\b(at least|minimum|overnight)\b/.test(s) || /\bplus\b/.test(s)) qual = 'atleast';
  const rng = s.match(/(\d+(?:\.\d+)?)\s*(?:to|-|–|—)\s*(\d+(?:\.\d+)?)\s*(hours?|hrs?|minutes?|mins?)/);
  if(rng){
    const mult = /^h/.test(rng[3]) ? 60 : 1;
    return {min: parseFloat(rng[1])*mult, max: parseFloat(rng[2])*mult, qual, raw:str};
  }
  let total = 0, found = false;
  const h = s.match(/(\d+(?:\.\d+)?)\s*(hours?|hrs?)\b/);  if(h){ total += parseFloat(h[1])*60; found = true; }
  const m = s.match(/(\d+(?:\.\d+)?)\s*(minutes?|mins?)\b/); if(m){ total += parseFloat(m[1]);    found = true; }
  if(!found){ const n = s.match(/(\d+(?:\.\d+)?)/); if(n){ total = parseFloat(n[1]); found = true; } }
  if(!found) return null;
  return {min: total, max: total, qual, raw: str};
}
function fmtDur(mins){
  mins = Math.max(0, Math.round(mins));
  if(mins < 60) return mins + ' min';
  const h = Math.floor(mins/60), m = mins % 60;
  return m ? h + ' hr ' + m + ' min' : h + ' hr';
}
function fmtTime(t){
  if(!t) return '';
  const lo = roundUp5(t.min), hi = roundUp5(t.max);
  if(t.qual === 'under')   return '≤' + fmtDur(hi);
  if(t.qual === 'atleast') return fmtDur(lo) + '+';
  if(lo !== hi) return (hi < 60) ? (lo + '–' + hi + ' min') : (fmtDur(lo) + '–' + fmtDur(hi));
  return fmtDur(lo);
}
function totalTime(r){
  const p = parseTime(r.prepTime), c = parseTime(r.cookTime);
  if(!p && !c) return null;
  const min = (p?p.min:0) + (c?c.min:0);
  const max = (p?p.max:0) + (c?c.max:0);
  const qual = ((p&&p.qual==='atleast')||(c&&c.qual==='atleast')) ? 'atleast'
             : ((p&&p.qual==='under')||(c&&c.qual==='under')) ? 'under' : null;
  return {min, max, qual};
}
function planMinutes(r){ const t = totalTime(r); return t ? roundUp5(t.max) : null; }

/* ---------------- plan-ahead detection ---------------- */
const AHEAD_RULES = [
  [/\bovernight\b/i,                                   'Overnight',   12*60],
  [/\bthaw(ed|ing)?\b/i,                               'Thaw ahead',  12*60],
  [/\b(the )?(day|night) before\b/i,                   'Day before',  12*60],
  [/\bnext day\b/i,                                    'Day before',  12*60],
  [/\b(marinate|marinating)\b/i,                       'Marinate',     4*60],
  [/\b(refrigerate|chill|rest|rise|soak|brine)[^.]{0,60}?(\d+)\s*(?:to\s*\d+\s*)?hours?/i, 'Plan ahead', 0],
  [/\bat least (\d+)\s*hours?\b/i,                     'Plan ahead',   0]
];
/* Sentences about keeping leftovers mention the same words ("refrigerator for 24 hours")
   but say nothing about starting early -- exclude them before matching. */
const STORAGE_RE = /\b(stor(e|ed|es|age)|leftovers?|keeps?|will keep|freezes?|freezer for|for up to|lasts?)\b/i;
function detectAhead(r){
  const hay = [r.prepTime, r.cookTime, r.notes||'', ...(r.instructions||[])].join(' \n ');
  const sentences = hay.split(/(?<=[.!?])\s+|\n/).filter(s=> s && !STORAGE_RE.test(s));
  for(const [re, label, mins] of AHEAD_RULES){
    for(const sentence of sentences){
      const m = sentence.match(re);
      if(!m) continue;
      let minutes = mins;
      if(!minutes){
        const num = m.slice(1).map(x=>parseFloat(x)).find(x=>!isNaN(x));
        minutes = (num || 2) * 60;
      }
      if(minutes >= 120) return {label, minutes};
    }
  }
  return null;
}

/* ---------------- servings + scaling ---------------- */
function parseServings(s){
  const str = String(s===undefined||s===null ? '' : s).trim();
  if(!str) return null;
  const m = str.match(/(\d+)/);
  if(!m) return null;
  const servingWord  = /servings?\b/i.test(str);
  const pureNum      = /^\d+\s*(?:(?:-|–|to)\s*\d+)?$/i.test(str);
  const servesPrefix = /^serves\b/i.test(str);
  /* only a real serving count drives the +/- stepper; "Makes 2 cups",
     "16-18 cookies" and "Two 12-inch pizzas" get multipliers only. */
  const servingBased = pureNum || servesPrefix || servingWord;
  let base = parseInt(m[1],10);
  if(servingWord){ const sm = str.match(/(\d+)\s*servings?/i); if(sm) base = parseInt(sm[1],10); }
  return { base, servingBased, raw: str };
}
function parseQty(tok){
  tok = tok.trim();
  let m = tok.match(/^(\d+)\s+(\d+)\/(\d+)$/); if(m) return +m[1] + (+m[2]/+m[3]);

}
function fmtNum(n, integerOnly){
  if(!isFinite(n)) return '';
  if(integerOnly) return String(n < 1 ? Math.round(n*10)/10 : Math.round(n));
  if(n >= 10) return String(Math.round(n));
  if(Math.abs(n - Math.round(n)) < 0.001) return String(Math.round(n));
  const whole = Math.floor(n), frac = n - whole;
  const cands = [[1,2],[1,3],[2,3],[1,4],[3,4],[1,8],[3,8],[5,8],[7,8],[1,6],[5,6]];
  let best=null, bd=1;
  cands.forEach(([a,b])=>{ const d=Math.abs(frac-a/b); if(d<bd){ bd=d; best=[a,b]; } });
  if(bd < 0.045) return (whole ? whole+' ' : '') + best[0]+'/'+best[1];
  return String(Math.round(n*100)/100);
}
const NOSCALE_PHRASE = /\b(to taste|for serving|for garnish|for greasing|for frying|for dusting|for sprinkling|for brushing|for the top|for cooking|cooking spray|as needed|serving suggestion)\b/i;
const SEASONING_HEAD = /^(kosher |sea |flaky |fine |coarse |table |freshly ground |freshly cracked |ground |cracked )*(salt|black pepper|white pepper|pepper)\b/i;
/* Seasonings don't scale linearly. Test the HEAD NOUN, not the whole line -- otherwise
   a product name like "Tomato Paste, No Salt Added" gets wrongly frozen. */
function isNoScale(line){
  if(NOSCALE_PHRASE.test(line)) return true;
  const rest = line
    .replace(/^(\d+\s+\d+\/\d+|\d+\/\d+|\d+(?:\.\d+)?)\s*[A-Za-z]*\.?\s*/, '')
    .replace(/\([^)]*\)/g, '')
    .trim();
  return SEASONING_HEAD.test(rest);
}
const UNIT_RE = /^(lbs?|pounds?|oz|ounces?|g|kg|ml|l|liters?|cups?|tbsp|tsp|tablespoons?|teaspoons?|cloves?|sprigs?|slices?|bunch|bunches|inch|quarts?|pints?|sticks?)\b/i;
const METRIC_RE = /^\s*(g|kg|ml|l)\b/i;
/* units that inflect in English; metric abbreviations and Tbsp/tsp never do */
const PLURALS = [['cups','cup'],['lbs','lb'],['pounds','pound'],['ounces','ounce'],['cloves','clove'],
                 ['sprigs','sprig'],['slices','slice'],['cans','can'],['sticks','stick'],
                 ['tablespoons','tablespoon'],['teaspoons','teaspoon'],['quarts','quart'],['pints','pint']];
function inflect(unit, qty){
  if(!unit) return unit;
  const plural = qty > 1;
  for(const [p,s] of PLURALS){
    if(unit.toLowerCase()===p) return plural ? unit : matchCase(unit, s);
    if(unit.toLowerCase()===s) return plural ? matchCase(unit, p) : unit;
  }
  return unit;
}
function matchCase(src, out){ return /^[A-Z]/.test(src) ? out.charAt(0).toUpperCase()+out.slice(1) : out; }
function scaleLine(line, f){
  if(f === 1) return {text: line, unscaled: false};
  if(isNoScale(line)) return {text: line, unscaled: true};
  const lead = line.match(/^(\d+\s+\d+\/\d+|\d+\/\d+|\d+(?:\.\d+)?)(\s*)([A-Za-z]*)/);
  if(!lead) return {text: line, unscaled: false};
  const hasUnit = UNIT_RE.test(lead[3]);
  const qty = parseQty(lead[1]) * f;
  const metricLead = METRIC_RE.test(lead[3]);
  let out = fmtNum(qty, metricLead) + lead[2] + inflect(lead[3], qty) + line.slice(lead[0].length);
  if(hasUnit){
    /* the first parenthetical is a unit conversion of the leading qty -> scale it too.
       a bare count like "1 (14 oz/400 g) can" has no unit, so its package size is left alone. */
    out = out.replace(/\(([^)]*)\)/, (whole, inner)=>{
      if(!/\d/.test(inner)) return whole;
      const scaled = inner.replace(/(\d+\s+\d+\/\d+|\d+\/\d+|\d+(?:\.\d+)?)(\s*[A-Za-z]*)/g, (mm, num, tail)=>{
        const v = parseQty(num) * f;
        return fmtNum(v, METRIC_RE.test(tail)) + (tail ? tail.replace(/[A-Za-z]+$/, u=>inflect(u, v)) : '');
      });
      return '(' + scaled + ')';
    });
  }
  return {text: out, unscaled: false};
}
function servingsLabel(s){
  const str = String(s);
  return /^(makes|serves)\b/i.test(str) ? str : 'Serves ' + str;
}

let state = { query:"", category:null, cuisine:null, sort:"az", made:"all", aheadOnly:false };
const COURSE_ORDER = ["Appetizer","Salad","Soup","Bread","Side","Main","Dessert","Breakfast","Drink"];
const STALE_DAYS = 75;   /* "had it, but not in 2-3 months" */

function uniqueSorted(arr){ return [...new Set(arr)].sort((a,b)=>a.localeCompare(b)); }
function orderByList(values, order){
  const set = new Set(values);
  const known = order.filter(v=>set.has(v));
  const unknown = [...set].filter(v=>!order.includes(v)).sort((a,b)=>a.localeCompare(b));
  return [...known, ...unknown];
}
const ALL_CATEGORIES = orderByList(RECIPES.map(r=>r.category), COURSE_ORDER);
const ALL_CUISINES   = uniqueSorted(RECIPES.map(r=>r.cuisine));
function countFor(field, value){ return RECIPES.filter(r=>r[field]===value).length; }

function renderChips(){

    catWrap.appendChild(chip);

    chip.onclick = ()=>{ state.cuisine = state.cuisine===c ? null : c; render(); };
    cuiWrap.appendChild(chip);
  });
}

function matchesQuery(recipe, q){
  if(!q) return true;
  const t = q.toLowerCase();
  return [recipe.title, recipe.shortTitle, recipe.source, recipe.cuisine, recipe.category, recipe.notes,
          ...(recipe.tags||[]), ...(recipe.ingredients||[]), ...(recipe.instructions||[])]
    .filter(Boolean).join(' ').toLowerCase().includes(t);
}
function passesMade(r){
  const n = timesMade(r.id), last = lastMade(r.id), d = daysSince(last);
  switch(state.made){
    case 'never':  return n === 0;
    case 'made':   return n > 0;
    case 'stale':  return n > 0 && d !== null && d >= STALE_DAYS;
    case 'recent': return n > 0 && d !== null && d < 30;
    default:       return true;
  }
}
function getFiltered(){
  let list = RECIPES.filter(r=>
    (!state.category || r.category===state.category) &&
    (!state.cuisine  || r.cuisine ===state.cuisine)  &&
    (!state.aheadOnly || r._ahead) &&
    passesMade(r) && matchesQuery(r, state.query)
  );
  const byTitle = (a,b)=>a.title.localeCompare(b.title);
  const sorters = {
    az: byTitle,
    recent: (a,b)=>{ const A=lastMade(a.id), B=lastMade(b.id);
                     if(!A && !B) return byTitle(a,b); if(!A) return 1; if(!B) return -1;
                     return B.localeCompare(A) || byTitle(a,b); },
    stale:  (a,b)=>{ const A=lastMade(a.id), B=lastMade(b.id);
                     if(!A && !B) return byTitle(a,b); if(!A) return -1; if(!B) return 1;
                     return A.localeCompare(B) || byTitle(a,b); },
    most:   (a,b)=> timesMade(b.id)-timesMade(a.id) || byTitle(a,b),
    rating: (a,b)=>{ const A=avgRating(a.id)||-1, B=avgRating(b.id)||-1; return B-A || byTitle(a,b); },
    quick:  (a,b)=>{ const A=a._plan===null?1e9:a._plan, B=b._plan===null?1e9:b._plan; return A-B || byTitle(a,b); }
  };
  return list.sort(sorters[state.sort] || byTitle);
}

function exportData(){

  const blob = new Blob([payload], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);

function importData(e){
  const f = e.target.files && e.target.files[0];
  if(!f) return;
  const fr = new FileReader();
  fr.onload = ()=>{
    try{
      DATA = mergeStates(DATA, JSON.parse(fr.result));
      persist(); render();
      alert('Imported. ' + DATA.cookLog.filter(e=>!e._d).length + ' cook entries now on file.');

  e.target.value = '';

function renderScaleBar(){
  const r = modalRecipe, sv = r._servings, f = modalFactor;

/* ---------------- date helpers (Mon-start weeks) ---------------- */
const DAY_NAMES = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
function isoOf(d){ return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10); }
function dateOf(iso){ return new Date(iso+'T00:00:00'); }
function addDays(iso, n){ const d=dateOf(iso); d.setDate(d.getDate()+n); return isoOf(d); }
function mondayOf(iso){ const d=dateOf(iso); const wd=(d.getDay()+6)%7; d.setDate(d.getDate()-wd); return isoOf(d); }
function fmtDayLabel(iso){ const d=dateOf(iso); return MONTHS[d.getMonth()].slice(0,3)+' '+d.getDate(); }
function fmtRange(a,b){
  const x=dateOf(a), y=dateOf(b);
  const sameMonth = x.getMonth()===y.getMonth();
  return MONTHS[x.getMonth()]+' '+x.getDate()+' – '+(sameMonth?'':MONTHS[y.getMonth()]+' ')+y.getDate()+', '+y.getFullYear();
}

/* ---------------- preferences ---------------- */
function prefs(){
  const p = DATA.prefs || (DATA.prefs = {});
  if(p.household === undefined) p.household = 2;
  if(!p.rituals) p.rituals = [];
  if(p.dinnerOnly === undefined) p.dinnerOnly = true;
  return p;
}
const DINNER_CATEGORIES = ['Main','Soup'];
function isDinnerish(r){ return DINNER_CATEGORIES.indexOf(r.category) !== -1; }

/* ---------------- plan accessors ---------------- */
function planAt(iso){ const e = DATA.plan[iso]; return (e && !e._d) ? e : null; }
function setPlan(iso, entry){
  DATA.plan[iso] = entry ? Object.assign({}, entry, {_t: Date.now()})
                         : {_d: true, _t: Date.now()};
  persist();
  if(typeof pushWrite === 'function') pushWrite({table:'plan_days', iso, row: DATA.plan[iso]});
}
function recipeById(id){ return RECIPES.find(r=>r.id===id) || null; }
function slotServings(entry, r){
  if(entry && entry.servings) return entry.servings;
  const sv = r && r._servings;
  return (sv && sv.servingBased) ? sv.base : null;
}
function slotFactor(entry, r){
  const sv = r && r._servings;
  if(!sv || !sv.servingBased) return 1;
  const want = slotServings(entry, r);
  return want ? want / sv.base : 1;
}

/* ---------------- key ingredients (for overlap + shopping) ---------------- */
const STAPLE_WORDS = ['salt','pepper','water','olive oil','oil','butter','sugar','flour','garlic','onion',
  'kosher salt','black pepper','vegetable oil','cooking spray','ice'];
const SECTION_RULES = [
  ['Produce',        /\b(lettuce|lemon|lime|orange|apple|banana|onion|shallot|garlic|ginger|potato|tomato|carrot|celery|pepper[s]?\b|bell pepper|cabbage|kale|chard|spinach|broccoli|cauliflower|zucchini|squash|eggplant|mushroom|cilantro|parsley|basil|thyme|rosemary|sage|mint|dill|scallion|cucumber|avocado|corn|bean sprout|leek|turnip|radish|herb|salad|arugula|pea[s]?\b|chile|chili pepper|jalapeno|serrano)/i],
  ['Meat & Seafood', /\b(chicken|beef|pork|lamb|turkey|duck|bacon|sausage|chorizo|prosciutto|ham|steak|thighs?\b|breasts?\b|ground (beef|pork|lamb|turkey|chicken|veal|sausage)|shrimp|fish|salmon|anchov|clam|mussel|squid|meatball)/i],
  ['Dairy & Eggs',   /\b(milk|cream|butter|cheese|yogurt|egg[s]?\b|ricotta|parmesan|mozzarella|feta|cheddar|gruyere|sour cream|creme|mascarpone|cotija|pecorino|labne)/i],
  ['Frozen',         /\b(frozen|ice cream|puff pastry|phyllo|waffle fries)/i],
  ['Bakery',         /\b(bread|baguette|ciabatta|sourdough|roll|tortilla|pita|bun|brioche|panko|breadcrumb)/i],
  ['Spices',         /\b(cumin|coriander|turmeric|paprika|cinnamon|cardamom|nutmeg|cayenne|curry powder|garam masala|oregano|bay leaf|peppercorn|chili powder|red pepper flakes|italian seasoning|seasoning|vanilla|saffron|fennel seed|dried thyme|dried oregano)/i],
  ['Pantry',         /\b(flour|sugar|rice|pasta|noodle|stock|broth|can|jar|vinegar|oil|sauce|paste|bean[s]?\b|lentil|chickpea|nut[s]?\b|almond|walnut|pecan|pistachio|cashew|peanut|honey|syrup|soy|coconut milk|tahini|mustard|mayo|olive|caper|raisin|date[s]?\b|chocolate|yeast|baking powder|baking soda|cornstarch|oat|quinoa|farro|couscous|wine|sherry|bourbon)/i]
];
function sectionFor(text){
  for(const [name, re] of SECTION_RULES) if(re.test(text)) return name;
  return 'Other';
}
function ingredientNoun(line){
  let s = line
    .replace(/^(\d+\s+\d+\/\d+|\d+\/\d+|\d+(?:\.\d+)?)\s*/, '')
    .replace(/\([^)]*\)/g, ' ')
    .replace(/^(lbs?|pounds?|oz|ounces?|g|kg|ml|l|cups?|tbsp|tsp|tablespoons?|teaspoons?|cloves?|sprigs?|slices?|cans?|bunch(es)?|sticks?|quarts?|pints?|packages?|heads?|knobs?|strips?|large|small|medium)\b\.?\s*/i, '')
    .split(/,| - |—/)[0]
    .replace(/\b(fresh|freshly|finely|coarsely|roughly|thinly|chopped|minced|grated|sliced|diced|peeled|crushed|drained|rinsed|packed|ground|whole|plain|full-fat|low-sodium|unsalted|boneless|skinless|extra-virgin|homemade|optional|divided|softened|melted|beaten|smashed|torn|trimmed|cooked|uncooked|dried|prepared)\b/gi, ' ')
    .replace(/\s+/g,' ').trim().toLowerCase();
  return s;
}
function keyIngredients(r){
  const out = new Set();
  (r.ingredients||[]).forEach(line=>{
    const n = ingredientNoun(line);
    if(!n || n.length < 3) return;
    if(STAPLE_WORDS.some(w=> n===w || n.indexOf(w)!==-1 && n.length < w.length+4)) return;
    out.add(n);
  });
  return out;
}
const KEY_CACHE = new Map();
function keyIng(r){ if(!KEY_CACHE.has(r.id)) KEY_CACHE.set(r.id, keyIngredients(r)); return KEY_CACHE.get(r.id); }
const PERISHABLE_SECTIONS = ['Produce','Dairy & Eggs','Meat & Seafood'];
const HERB_RE = /\b(basil|cilantro|parsley|dill|mint|thyme|rosemary|sage|tarragon|chive|oregano|scallion|herb)\b/i;
/* Overlap is scored by what would otherwise go to waste: a half-bunch of dill or
   a tub of ricotta is worth far more than a shared pantry staple. */
function overlapWeight(a, b){
  let w = 0, shared = [];
  keyIng(a).forEach(x=>{
    if(!keyIng(b).has(x)) return;
    shared.push(x);
    if(HERB_RE.test(x)) w += 3.0;
    else if(/\b(can|canned|jarred|jar|dried|frozen|paste|powder)\b/i.test(x)) w += 0.5;
    else if(PERISHABLE_SECTIONS.indexOf(sectionFor(x)) !== -1) w += 2.0;
    else w += 0.5;
  });
  return {weight: w, shared};
}
function overlapCount(a, b){ return overlapWeight(a, b).shared.length; }

/* ---------------- suggestion engine ---------------- */
function hashJitter(str){ let h=0; for(let i=0;i<str.length;i++) h=(h*31+str.charCodeAt(i))|0; return Math.abs(h)%7; }
function scoreFor(r, iso, ctx){
  if(ctx.used.has(r.id)) return -Infinity;
  const dayIdx = (dateOf(iso).getDay()+6)%7;      /* 0 = Monday */
  const weeknight = dayIdx <= 3;
  let s = 0, why = [];

  const n = timesMade(r.id), d = daysSince(lastMade(r.id));
  if(n === 0){ s += 52; why.push('new'); }
  else if(d >= STALE_DAYS){ s += 44 + Math.min(d - STALE_DAYS, 200)/10; why.push('due a revisit'); }
  else if(d >= 30){ s += 8; }
  else { s -= 65; }
  if(n >= 3 && d >= 30){ s += 10; why.push('a favourite'); }

  const avg = avgRating(r.id);
  if(avg) s += (avg - 3) * 9;

  const t = r._plan;
  if(t !== null){
    if(weeknight && t > 50){ s -= (t - 50) / 2; }
    if(!weeknight && t > 60){ s += 7; }
    if(weeknight && t <= 40){ s += 6; }
  }
  if(r._ahead && weeknight) s -= 14;

  const cuisineHits = ctx.slotted.filter(o=> o.cuisine === r.cuisine).length;
  if(cuisineHits) s -= 34 * cuisineHits;
  const catHits = ctx.slotted.filter(o=> o.category === r.category).length;
  if(catHits >= 4) s -= 12 * (catHits - 3);

  let ov = 0, shared = [];
  ctx.slotted.forEach(other=>{
    const o = overlapWeight(r, other);
    if(o.weight > ov){ ov = o.weight; shared = o.shared; }
  });
  if(ov >= 2){
    s += Math.min(ov, 9) * 7;
    const herb = shared.find(x=> HERB_RE.test(x));
    why.push(herb ? ('shares the '+herb) : 'uses what you already need');
  }

  /* a dish big enough to feed the household twice is a mild plus, not a driver */
  const sv = r._servings;
  if(sv && sv.servingBased && sv.base >= prefs().household * 2) s += 5;

  s += hashJitter(r.id + iso);
  return {score: s, why: why.slice(0,2).join(' · ')};
}
function weekContext(weekStart, skipIso){
  const used = new Set(), cuisines = new Set(), slotted = [];
  for(let i=0;i<7;i++){
    const iso = addDays(weekStart, i);
    if(iso === skipIso) continue;
    const e = planAt(iso);
    if(!e || e.leftoverOf) continue;
    const r = recipeById(e.recipeId);
    if(!r) continue;
    used.add(r.id); cuisines.add(r.cuisine); slotted.push(r);
  }
  return {used, cuisines, slotted};
}
function candidatesFor(iso, ctx, includeAll){
  const pool = RECIPES.filter(r=> includeAll ? true : isDinnerish(r));
  return pool.map(r=>{
    const sc = scoreFor(r, iso, ctx);
    return sc === -Infinity ? null : {r, score: sc.score, why: sc.why};
  }).filter(Boolean).sort((a,b)=> b.score - a.score);
}
function ritualFor(iso){
  const dayIdx = (dateOf(iso).getDay()+6)%7;
  return prefs().rituals.find(x=> x.day === dayIdx) || null;
}
function suggestWeek(weekStart){
  /* fill only empty slots; rituals win their day */
  const order = [];
  for(let i=0;i<7;i++) order.push(addDays(weekStart, i));
  order.forEach(iso=>{
    if(planAt(iso)) return;
    const rit = ritualFor(iso);
    if(rit && recipeById(rit.recipeId)){
      const ctx = weekContext(weekStart, iso);
      if(!ctx.used.has(rit.recipeId)){ setPlan(iso, {recipeId: rit.recipeId, ritual:true}); return; }
    }
  });
  order.forEach(iso=>{
    if(planAt(iso)) return;
    const ctx = weekContext(weekStart, iso);
    const best = candidatesFor(iso, ctx, false)[0];
    if(best) setPlan(iso, {recipeId: best.r.id});
  });
  persist();
}

/* ---------------- prep tasks ---------------- */
function prepTasks(weekStart){
  const out = [];
  for(let i=0;i<7;i++){
    const iso = addDays(weekStart, i);
    const e = planAt(iso);
    if(!e || e.leftoverOf) continue;
    const r = recipeById(e.recipeId);
    if(!r || !r._ahead) continue;
    const lead = r._ahead.minutes;
    const onIso = lead >= 8*60 ? addDays(iso, -1) : iso;
    out.push({when: onIso, forIso: iso, recipe: r, label: r._ahead.label, minutes: lead});
  }
  return out.sort((a,b)=> a.when.localeCompare(b.when));
}

/* ---------------- shopping list ---------------- */
function haveInInventory(noun){
  const inv = [...(DATA.inventory.freezer||[]), ...(DATA.inventory.pantry||[])];
  return inv.find(it=> it && it.name && noun.indexOf(String(it.name).toLowerCase()) !== -1);
}
function buildShoppingList(weekStart){
  const bySection = {};
  const seen = new Map();
  for(let i=0;i<7;i++){
    const iso = addDays(weekStart, i);
    const e = planAt(iso);
    if(!e || e.leftoverOf) continue;
    const r = recipeById(e.recipeId);
    if(!r) continue;
    const f = slotFactor(e, r);
    (r.ingredients||[]).forEach(line=>{
      if(line.trim().endsWith(':')) return;
      const noun = ingredientNoun(line);
      if(!noun || noun.length < 3) return;
      const scaled = scaleLine(line, f).text;
      const sec = sectionFor(line);
      const key = sec + '|' + noun;
      if(seen.has(key)){ seen.get(key).from.push(displayTitle(r)); return; }
      const item = {text: scaled, from: [displayTitle(r)], have: !!haveInInventory(noun)};
      seen.set(key, item);
      (bySection[sec] || (bySection[sec] = [])).push(item);
    });
  }
  return bySection;
}
const SECTION_ORDER = ['Produce','Meat & Seafood','Dairy & Eggs','Bakery','Frozen','Pantry','Spices','Other'];

/* ---------------- week rendering ---------------- */
function renderWeek(){
  const grid = document.getElementById('weekGrid');
  document.getElementById('weekRange').textContent = fmtRange(weekStart, addDays(weekStart,6));
  grid.innerHTML = '';
  const today = todayISO();

  for(let i=0;i<7;i++){
    const iso = addDays(weekStart, i);
    const e = planAt(iso);
    const cell = document.createElement('div');
    cell.className = 'day' + (iso===today ? ' today' : '') + (iso<today ? ' past' : '');
    let inner = `<div class="day-head"><span>${DAY_NAMES[i]}</span><span class="dnum">${dateOf(iso).getDate()}</span></div>`;

    if(!e){
      inner += `<div class="slot-empty">
          <button data-add="${iso}">+ add dinner</button>
          <button data-sug="${iso}">suggest</button>
        </div>`;
    } else if(e.leftoverOf){
      const src = recipeById((planAt(e.leftoverOf)||{}).recipeId);
      inner += `<div class="slot leftover">
          <div class="slot-title">Leftovers</div>
          <div class="slot-meta"><span class="lo-pill">from ${DAY_NAMES[(dateOf(e.leftoverOf).getDay()+6)%7]}</span>${src?`<span>${escapeHTML(displayTitle(src))}</span>`:''}</div>
          <div class="slot-actions"><button data-clear="${iso}">remove</button></div>
        </div>`;
    } else {
      const r = recipeById(e.recipeId);
      if(!r){ inner += `<div class="slot-empty"><button data-clear="${iso}">missing recipe — clear</button></div>`; }
      else {
        const serv = slotServings(e, r);
        const cooked = cookEvents(r.id).some(ev=> ev.date === iso);
        const meta = [];
        if(r._plan) meta.push(`<span>${fmtDur(r._plan)}</span>`);
        if(serv) meta.push(`<span>serves ${serv}</span>`);
        meta.push(`<span>${zwsp(escapeHTML(r.cuisine))}</span>`);
        if(e.ritual) meta.push(`<span class="lo-pill">ritual</span>`);
        if(serv && serv >= prefs().household * 2) meta.push(`<span class="lo-pill">makes leftovers</span>`);
        if(r._ahead) meta.push(`<span class="ahead-pill">${r._ahead.label}</span>`);
        if(cooked) meta.push(`<span class="cooked-flag">✓ cooked</span>`);
        inner += `<div class="slot">
            <div class="slot-title" data-open="${r.id}">${zwsp(escapeHTML(displayTitle(r)))}</div>
            <div class="slot-meta">${meta.join('')}</div>
            <div class="slot-actions">
              <button class="${cooked?'done':''}" data-cook="${iso}">${cooked?'✓ cooked':'cooked'}</button>
              <button data-add="${iso}">swap</button>
              <button data-lo="${iso}">leftovers →</button>
              <button data-clear="${iso}">×</button>
            </div>
          </div>`;
      }
    }
    cell.innerHTML = inner;
    grid.appendChild(cell);
  }

  grid.querySelectorAll('[data-add]').forEach(b=> b.onclick = ()=> openPicker(b.dataset.add));
  grid.querySelectorAll('[data-sug]').forEach(b=> b.onclick = ()=>{
    const iso = b.dataset.sug;
    const best = candidatesFor(iso, weekContext(weekStart, iso), false)[0];
    if(best){ setPlan(iso, {recipeId: best.r.id}); renderWeek(); }
  });
  grid.querySelectorAll('[data-clear]').forEach(b=> b.onclick = ()=>{ setPlan(b.dataset.clear, null); renderWeek(); });
  grid.querySelectorAll('[data-open]').forEach(b=> b.onclick = ()=>{ const r=recipeById(b.dataset.open); if(r) openModal(r); });
  grid.querySelectorAll('[data-lo]').forEach(b=> b.onclick = ()=>{
    const iso = b.dataset.lo, next = addDays(iso, 1);
    if(planAt(next) && !confirm('Replace what is planned for the next day with leftovers?')) return;
    setPlan(next, {leftoverOf: iso}); renderWeek();
  });
  grid.querySelectorAll('[data-cook]').forEach(b=> b.onclick = ()=>{
    const iso = b.dataset.cook, e = planAt(iso);
    if(!e) return;
    const existing = cookEvents(e.recipeId).find(ev=> ev.date === iso);
    if(existing) removeCook(existing.id); else addCook(e.recipeId, iso, null, '');
    renderWeek(); renderGrid();
  });

  renderPrepStrip();
  renderWeekSummary();
  if(document.getElementById('shopPanel').dataset.open) renderShop();
}

function renderPrepStrip(){

  host.innerHTML = `<div class="prep-strip"><b>Prep ahead this week</b>` + tasks.map(t=>{
    const dayName = DAY_NAMES[(dateOf(t.when).getDay()+6)%7];

}

function renderWeekSummary(){
  const host = document.getElementById('weekSummary');
  let filled=0, mins=0, news=0; const cuis=new Set();
  for(let i=0;i<7;i++){
    const e = planAt(addDays(weekStart,i));

    const r = recipeById(e.recipeId); if(!r) continue;

}

function closePicker(){

}
function renderPicker(){
  const q = document.getElementById('pickerInput').value.trim().toLowerCase();
  const all = document.getElementById('pickerAll').checked;
  const ctx = weekContext(weekStart, pickerIso);
  const ranked = candidatesFor(pickerIso, ctx, all);

  const sug = document.getElementById('pickerSuggest');
  if(!q){
    const top = ranked.slice(0,3);
    sug.innerHTML = top.length ? `<div class="picker-sug"><h4>Suggested for this night</h4>${top.map(c=>
      `<div class="prow" data-pick="${c.r.id}">
         <span class="pt">${zwsp(escapeHTML(displayTitle(c.r)))}</span>
         <span class="why">${c.why||''}</span>
         <span class="pm">${c.r._plan?fmtDur(c.r._plan):''} · ${zwsp(escapeHTML(c.r.cuisine))}</span>
       </div>`).join('')}</div>` : '';
  } else sug.innerHTML = '';

  const rows = (q ? ranked.filter(c=> matchesQuery(c.r, q)) : ranked).slice(0, 120);
  document.getElementById('pickerList').innerHTML = rows.map(c=>{
    const n = timesMade(c.r.id), last = lastMade(c.r.id);
    return `<div class="prow" data-pick="${c.r.id}">
      <span class="pt">${zwsp(escapeHTML(displayTitle(c.r)))}</span>
      <span class="pm">${n?`made ${n}× · ${relTime(last)}`:'never made'} · ${c.r._plan?fmtDur(c.r._plan):''} · ${zwsp(escapeHTML(c.r.cuisine))}</span>
    </div>`;
  }).join('') || `<div class="cook-empty">Nothing matches that.</div>`;

  document.querySelectorAll('#pickerOverlay [data-pick]').forEach(el=> el.onclick = ()=>{
    setPlan(pickerIso, {recipeId: el.dataset.pick});
    closePicker(); renderWeek();
  });
}
document.getElementById('pickerClose').onclick = closePicker;
document.getElementById('pickerOverlay').onclick = e=>{ if(e.target.id==='pickerOverlay') closePicker(); };
document.getElementById('pickerInput').addEventListener('input', renderPicker);
document.getElementById('pickerAll').addEventListener('change', renderPicker);

/* ---------------- history / month ---------------- */
function renderMonth(){
  const [y, m] = monthCursor.split('-').map(Number);
  document.getElementById('monRange').textContent = MONTHS[m-1] + ' ' + y;
  const first = new Date(y, m-1, 1), last = new Date(y, m, 0);
  const lead = (first.getDay()+6)%7;
  const grid = document.getElementById('monthGrid');
  grid.innerHTML = DAY_NAMES.map(d=>`<div class="mhead">${d}</div>`).join('');
  const today = todayISO();

  const cells = [];
  for(let i=0;i<lead;i++) cells.push(null);
  for(let d=1; d<=last.getDate(); d++) cells.push(isoOf(new Date(y, m-1, d)));
  while(cells.length % 7) cells.push(null);

  cells.forEach(iso=>{
    const div = document.createElement('div');
    if(!iso){ div.className='mcell out'; grid.appendChild(div); return; }
    div.className = 'mcell' + (iso===today?' today':'');
    const evs = DATA.cookLog.filter(e=> e.date === iso && !e._d);
    const planned = planAt(iso);
    let html = `<div class="mnum">${dateOf(iso).getDate()}</div>`;
    evs.forEach(e=>{
      const r = recipeById(e.recipeId);
      html += `<div class="mitem" data-open="${e.recipeId}">${r?zwsp(escapeHTML(displayTitle(r))):'—'}${e.rating?`<div class="mstars">${starStr(e.rating)}</div>`:''}</div>`;
    });
    if(!evs.length && planned && !planned.leftoverOf){
      const r = recipeById(planned.recipeId);
      if(r) html += `<div class="mitem" style="opacity:.5" data-open="${r.id}">${zwsp(escapeHTML(displayTitle(r)))}</div>`;
    }
    div.innerHTML = html;
    grid.appendChild(div);
  });
  grid.querySelectorAll('[data-open]').forEach(el=> el.onclick = ()=>{ const r=recipeById(el.dataset.open); if(r) openModal(r); });

  const inMonth = DATA.cookLog.filter(e=> !e._d && e.date && e.date.slice(0,7) === monthCursor);
  const cuis = new Set(inMonth.map(e=>{ const r=recipeById(e.recipeId); return r?r.cuisine:null; }).filter(Boolean));
  const never = RECIPES.filter(r=> timesMade(r.id)===0).length;
  document.getElementById('histStats').innerHTML = `<div class="hist-stats">
    <div class="hstat"><b>${inMonth.length}</b>meals this month</div>
    <div class="hstat"><b>${cuis.size}</b>cuisines</div>
    <div class="hstat"><b>${DATA.cookLog.filter(e=>!e._d).length}</b>logged all time</div>
    <div class="hstat"><b>${never}</b>never made yet</div>
  </div>`;
}
document.getElementById('monPrev').onclick = ()=>{
  let [y,m]=monthCursor.split('-').map(Number); m--; if(m<1){m=12;y--;}
  monthCursor = y+'-'+String(m).padStart(2,'0'); renderMonth();
};
document.getElementById('monNext').onclick = ()=>{
  let [y,m]=monthCursor.split('-').map(Number); m++; if(m>12){m=1;y++;}
  monthCursor = y+'-'+String(m).padStart(2,'0'); renderMonth();
};
document.getElementById('monToday').onclick = ()=>{ monthCursor = todayISO().slice(0,7); renderMonth(); };

document.addEventListener('keydown', e=>{ if(e.key==='Escape') closePicker(); });
prefs();
setView('cookbook');

/* ============================================================
   PHASE 3 — theme, deep links, making mode, screen wake, mobile

/* ---------------- theme (dark by default) ---------------- */
const THEME_KEY = 'cookbook.theme';
function currentTheme(){ try{ return localStorage.getItem(THEME_KEY) || 'light'; }catch(e){ return 'light'; } }
function applyTheme(mode){
  document.documentElement.setAttribute('data-theme', mode);
  try{ localStorage.setItem(THEME_KEY, mode); }catch(e){}
  const b = document.getElementById('themeBtn');
  if(b) b.textContent = mode==='dark' ? '◐ Light' : '◑ Dark';
}
applyTheme(currentTheme());
document.getElementById('themeBtn').onclick = ()=> applyTheme(currentTheme()==='dark' ? 'light' : 'dark');

/* ---------------- reading size ---------------- */
const FONT_KEY = 'cookbook.fontsize';
const FONT_STEPS = [[13.5,14],[15.5,16],[18,18.5]];
function fontIdx(){ const n = parseInt(localStorage.getItem(FONT_KEY)||'0',10); return isNaN(n)?0:Math.max(0,Math.min(2,n)); }
function applyFont(i){
  const [ing, step] = FONT_STEPS[i];
  document.documentElement.style.setProperty('--recipe-font', ing+'px');
  document.documentElement.style.setProperty('--step-font', step+'px');
  try{ localStorage.setItem(FONT_KEY, String(i)); }catch(e){}
  document.querySelectorAll('.fontsize button').forEach((b,k)=> b.classList.toggle('on', k===i));
}

/* ---------------- making mode (transient, device-local) ---------------- */
let making = false;
function makeKey(id){ return 'cookbook.making.'+id; }
function loadTicks(id){
  try{ return JSON.parse(localStorage.getItem(makeKey(id))) || {ing:[], step:[]}; }
  catch(e){ return {ing:[], step:[]}; }
}
function saveTicks(id, t){ try{ localStorage.setItem(makeKey(id), JSON.stringify(t)); }catch(e){} }
function clearTicks(id){ try{ localStorage.removeItem(makeKey(id)); }catch(e){} }
let ticks = {ing:[], step:[]};

function paintTicks(){
  const ing = document.getElementById('modalIngredients');
  const steps = document.getElementById('modalSteps');
  [...ing.querySelectorAll('li')].forEach((li,i)=>{
    if(li.classList.contains('heading')) return;
    li.classList.toggle('tick', ticks.ing.indexOf(i) !== -1);
  });
  [...steps.querySelectorAll('li')].forEach((li,i)=> li.classList.toggle('tick', ticks.step.indexOf(i) !== -1));
  const done = ticks.ing.length + ticks.step.length;
  const total = [...ing.querySelectorAll('li:not(.heading)')].length + steps.querySelectorAll('li').length;
  const prog = document.getElementById('makeProg');
  if(prog) prog.textContent = making ? `${done} of ${total} done` : '';
}
function toggleTick(kind, i){
  const arr = ticks[kind], at = arr.indexOf(i);
  if(at === -1) arr.push(i); else arr.splice(at,1);
  saveTicks(modalRecipe.id, ticks);
  paintTicks();
}
function wireTicks(){
  const ing = document.getElementById('modalIngredients');
  const steps = document.getElementById('modalSteps');
  [...ing.querySelectorAll('li')].forEach((li,i)=>{
    if(li.classList.contains('heading')) return;
    li.onclick = ()=>{ if(making) toggleTick('ing', i); };
  });
  [...steps.querySelectorAll('li')].forEach((li,i)=> li.onclick = ()=>{ if(making) toggleTick('step', i); });
}
function setMaking(on){
  making = on;
  document.getElementById('modalCard').classList.toggle('making', on);
  renderMakeBar();
  paintTicks();
  if(on) requestWake(); else releaseWake();
}
function renderMakeBar(){
  const host = document.getElementById('modalMake');
  const i = fontIdx();
  host.innerHTML = `<div class="make-bar ${making?'on':''}">
      <button class="icon-btn ${making?'on':''}" id="makeToggle">${making?'✓ Making mode on':'Start making mode'}</button>
      <span class="make-prog" id="makeProg"></span>
      ${making?`<button class="icon-btn" id="makeReset">reset ticks</button>`:''}
      <span style="flex:1"></span>
      <span class="sb-key">Text</span>
      <span class="fontsize">
        <button class="fs-a ${i===0?'on':''}" data-fs="0">A</button>
        <button class="fs-b ${i===1?'on':''}" data-fs="1">A</button>
        <button class="fs-c ${i===2?'on':''}" data-fs="2">A</button>
      </span>
      ${wakeSupported()?`<button class="icon-btn ${wakeOn?'on':''}" id="wakeBtn" title="Stop the screen dimming">${wakeOn?'☀ screen on':'☀ keep screen on'}</button>`:''}
    </div>`;
  host.querySelector('#makeToggle').onclick = ()=> setMaking(!making);
  const rst = host.querySelector('#makeReset');
  if(rst) rst.onclick = ()=>{ ticks={ing:[],step:[]}; clearTicks(modalRecipe.id); paintTicks(); };
  host.querySelectorAll('[data-fs]').forEach(b=> b.onclick = ()=>{ applyFont(+b.dataset.fs); renderMakeBar(); paintTicks(); });
  const wb = host.querySelector('#wakeBtn');
  if(wb) wb.onclick = ()=> wakeOn ? releaseWake(true) : requestWake(true);
}

/* ---------------- screen wake lock ---------------- */
let wakeLock = null, wakeOn = false;
function wakeSupported(){ return 'wakeLock' in navigator; }
async function requestWake(explicit){
  if(!wakeSupported()) return;
  try{
    wakeLock = await navigator.wakeLock.request('screen');
    wakeOn = true;
    wakeLock.addEventListener('release', ()=>{ wakeOn = false; });
    if(explicit) renderMakeBar();
  }catch(e){ wakeOn = false; }
}
function releaseWake(explicit){
  try{ if(wakeLock) wakeLock.release(); }catch(e){}
  wakeLock = null; wakeOn = false;
  if(explicit) renderMakeBar();
}
/* browsers drop the lock when the tab is backgrounded -- take it again on return */
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState === 'visible' && making && !wakeOn) requestWake();
});

/* ---------------- deep links (#r/<id>) ---------------- */
let suppressHash = false;
function hashFor(id){ return '#r/' + id; }
function openFromHash(){
  const m = (location.hash||'').match(/^#r\/(.+)$/);
  if(!m){ if(modalRecipe) closeModal(); return; }
  const r = recipeById(decodeURIComponent(m[1]));
  if(r && (!modalRecipe || modalRecipe.id !== r.id)) openModal(r);
}
window.addEventListener('hashchange', ()=>{ if(!suppressHash) openFromHash(); });

/* ---------------- modal action row ---------------- */
function renderModalActions(){
  const host = document.getElementById('modalActions');
  host.innerHTML = `<div class="modal-actions">
      <button class="icon-btn" id="copyLink">Copy link to this recipe</button>
      <span class="make-prog" id="copyMsg"></span>
    </div>`;
  host.querySelector('#copyLink').onclick = ()=>{
    const url = location.origin + location.pathname + hashFor(modalRecipe.id);
    const msg = host.querySelector('#copyMsg');
