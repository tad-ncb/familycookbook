name: Backup Supabase recipes

# Backs up the LIVE household data -- the tables the app writes to (plans,
# shopping lists, cook log, prefs, interested recipes, inventory, family
# submissions) -- to backups/live/*.json. These had no backup at all before.
#
# The big recipe archive (NYT/Epicurious/BBC/Other, ~60k rows) is NOT backed up
# here any more: it no longer lives in Supabase at all. It is static JSON in
# data/archive/ (served by GitHub Pages and versioned in git), rebuilt from the
# frozen lossless snapshot in backups/nyt_recipes/ by tools/build_archive_data.py.
on:
  schedule:
    - cron: '0 6 * * *'  # daily, 06:00 UTC
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch live tables from Supabase
        env:
          # anon key is public by design (access control is Postgres row-level
          # security) -- same key already shipped in index.html.
          SUPABASE_URL: https://kubvqmptumftqtfqrifs.supabase.co
          SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt1YnZxbXB0dW1mdHF0ZnFyaWZzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc1MDc0NzcsImV4cCI6MjEwMzA4MzQ3N30.uWvku48avh5aUIp6V7lwGoNz-nk6RT1SiHaKODyWI2Q
        run: |
          python3 - <<'PYEOF'
          import os, json, time, urllib.request

          base = os.environ['SUPABASE_URL'] + '/rest/v1/'
          key = os.environ['SUPABASE_ANON_KEY']
          headers = {'apikey': key, 'Authorization': f'Bearer {key}'}
          TABLES = ['cook_log', 'plan_days', 'prefs', 'shopping_lists', 'interested_recipes',
                    'inventory_items', 'family_submissions', 'client_errors']
          LIMIT = 50000  # these tables are tiny; hitting the limit means truncation, so fail
          os.makedirs('backups/live', exist_ok=True)
          out = {}
          for t in TABLES:
              for attempt in range(4):
                  try:
                      req = urllib.request.Request(f'{base}{t}?select=*&limit={LIMIT}', headers=headers)
                      with urllib.request.urlopen(req, timeout=60) as resp:
                          rows = json.loads(resp.read())
                      break
                  except Exception as e:
                      print(f'  {t}: retry {attempt} after {type(e).__name__}: {e}')
                      time.sleep(3 * (attempt + 1))
              else:
                  raise SystemExit(f'BACKUP ABORTED: could not read {t} (is the project paused?) -- previous backup left untouched')
              if len(rows) >= LIMIT:
                  raise SystemExit(f'BACKUP ABORTED: {t} returned {len(rows)} rows (limit) -- would be truncated')
              out[t] = rows
              print(f'{t}: {len(rows)} rows')
          # only write once EVERY table was read successfully
          for t, rows in out.items():
              rows.sort(key=lambda r: json.dumps(r, sort_keys=True))  # stable order => clean diffs
              with open(f'backups/live/{t}.json', 'w') as f:
                  json.dump(rows, f, ensure_ascii=False, indent=1, sort_keys=True)
          PYEOF

      - name: Commit snapshot if it changed
        run: |
          git config user.name "cookbook-backup-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A backups/live
          if git diff --cached --quiet; then
            echo "No changes since last backup."
            exit 0
          fi
          git commit -m "Daily backup: live tables ($(date -u +%Y-%m-%d))"
          # another bot commit (build / backup) may have landed since checkout
          git pull --rebase --quiet
          git push
