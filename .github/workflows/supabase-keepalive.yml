name: Supabase keep-alive

# Free-tier Supabase projects pause after ~7 days of inactivity. This project
# paused twice (Oct 22 and Nov 8) -- the second time despite successful read-only
# pings two and five days earlier -- so reads alone are not enough. This job now
# does a read AND a write (UPSERT of a heartbeat row, see migrations/013_keepalive.sql)
# every day, and fails loudly (GitHub emails) if either does not work.
on:
  schedule:
    - cron: '0 12 * * *'  # daily, 12:00 UTC
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query Supabase
        env:
          # anon key is public by design (same one shipped in index.html)
          SUPABASE_URL: https://kubvqmptumftqtfqrifs.supabase.co
          SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt1YnZxbXB0dW1mdHF0ZnFyaWZzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc1MDc0NzcsImV4cCI6MjEwMzA4MzQ3N30.uWvku48avh5aUIp6V7lwGoNz-nk6RT1SiHaKODyWI2Q
        run: |
          # --fail makes a paused/missing project (DNS error, 4xx/5xx) fail the
          # job, so GitHub emails you right away instead of weeks later.
          curl --fail --silent --show-error --retry 3 --retry-delay 5 \
            "$SUPABASE_URL/rest/v1/keepalive?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY"
          echo
          # write: heartbeat row (needs migrations/013_keepalive.sql applied once)
          curl --fail-with-body --silent --show-error --retry 3 --retry-delay 5 \
            -X POST "$SUPABASE_URL/rest/v1/keepalive?on_conflict=id" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: resolution=merge-duplicates,return=minimal" \
            -d "{\"id\":1,\"pinged_at\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\"note\":\"github-actions\"}"
          echo "Supabase read + write OK"
